name: Publish to npm (fallback)

# 兜底发布路径（NPM_TOKEN，手动触发）。主发布路径已迁至 .github/workflows/release.yml
# （GitHub Release 触发，OIDC trusted publishing，无 token 无 OTP，附 provenance）。
#
# 触发：仅手动 Run workflow（workflow_dispatch）。用于 OIDC 未配置 / release.yml 故障 / 紧急补发。
# 前置：仓库 Settings → Secrets → Actions 里配置 NPM_TOKEN
# （npm granular access token：bypass 2FA + direct publish 权限）。
# 注：npm 正系统性废止 bypass-2FA granular token，此路径仅为过渡兜底，能走 OIDC 就走 release.yml。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（vX.Y.Z，须与 packages/dsh-notes-plugin/package.json version 一致；留空跳过一致性闸）'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: 校验 tag 与 package.json 版本一致（提供了 tag 时）
        if: github.event.inputs.tag != ''
        env:
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          TAG="${TAG_INPUT#v}"
          PKG=$(node -p "require('./packages/dsh-notes-plugin/package.json').version")
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG 与 package.json version $PKG 不一致，先 npm version 对齐再触发"
            exit 1
          fi

      - name: 语法自检（prepublishOnly 也会再跑一次）
        working-directory: packages/dsh-notes-plugin
        run: npm run check

      - name: 发布到 npm（prepublishOnly 自动跑语法检查，挂了拒发）
        working-directory: packages/dsh-notes-plugin
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
