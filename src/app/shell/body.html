<div class="topbar">
  <div class="logo"><svg class="ic"><use href="#i-note"/></svg></div><b>dsh-notes</b>
  <span class="sub" id="topSub">你的笔记库 · 写下的约定与资料可注入 Agent 会话</span>
  <span class="sp"></span>
  <!-- 顶栏按钮文字统一包 .tb-t：≤480px 断点下 .ico-only 按钮（切换主题/DSH 主界面）收起文字只留图标（title 提示保留），刷新/速记保文字 -->
  <button class="tbtn" id="btnRefresh" title="重新拉取列表/文件夹（LLM 主题分类为异步回填，刷新可见）"><svg class="ic"><use href="#i-refresh"/></svg><span class="tb-t">刷新</span></button>
  <button class="tbtn" id="btnArchive" title="速记合并：把同一会话的速记合并成一篇；点按弹出预览，勾选后才执行（可撤销）"><svg class="ic"><use href="#i-check"/></svg><span class="tb-t">速记</span></button>
  <button class="tbtn ico-only" id="btnTheme" title="切换主题（暗色/亮色）"><svg class="ic"><use href="#i-theme"/></svg><span class="tb-t">切换主题</span></button>
  <a class="tbtn ico-only" href="/" id="btnHome" title="返回 DSH 主界面"><svg class="ic"><use href="#i-home"/></svg><span class="tb-t">DSH 主界面</span></a>
</div>

<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo"><svg class="ic"><use href="#i-note"/></svg></div><b id="brandName">笔记</b><span class="cnt" id="brandCnt"></span>
      <!-- 新建入口（自旧 chips 行迁入 brand 行右侧，筛选中心口径⑥） -->
      <span class="add-new" id="btnNew" title="新建笔记（Alt+N）"><svg class="ic"><use href="#i-plus"/></svg></span>
    </div>
    <div class="quick"><svg class="ic"><use href="#i-search"/></svg><input id="q" placeholder="搜索笔记、标签、内容…"><span class="kbd">Ctrl K</span></div>
    <!-- 筛选中心行（design/notes-filter-center.html）：筛选按钮(N) + 激活条件 chips（单行横滚，× 单条移除）+ 独立排序控件；popover 浮层不挤压树区 -->
    <div class="filterbar" id="filterbar">
      <button class="fbtn-filter" id="btnFilter" aria-haspopup="true" aria-expanded="false" title="筛选中心：分组勾选条件（组内 OR / 跨组 AND）"><svg class="ic"><use href="#i-filter"/></svg><span>筛选</span><span class="cnt" id="filterBd" style="display:none"></span></button>
      <div class="fchips" id="fchips"></div>
      <div class="fsort-wrap" id="sortWrap">
        <button class="fsort-btn" id="btnSort" title="排序（与筛选正交，互不重置）"></button>
        <div class="fsort-menu" id="fsortMenu"></div>
      </div>
      <div class="fpop" id="fpop" role="dialog" aria-label="筛选条件"></div>
    </div>
    <div class="tree" id="tree" tabindex="-1"></div>
    <!-- 底部：回收站 + 选择（多选合并，自旧 chips 行迁入）+ 设置；导出/导入 → 设置卡片「数据」区，整理建议 → 设置卡片「整理建议」行 -->
    <div class="side-foot">
      <div class="fbtn" id="btnTrash" title="回收站：查看已删除的笔记，可恢复或彻底删除"><svg class="ic"><use href="#i-trash"/></svg><span id="btnTrashT">回收站</span></div>
      <div class="fbtn" id="btnSelMode" title="多选笔记：勾选后可合并为一篇（Esc 退出）"><svg class="ic"><use href="#i-check"/></svg><span id="btnSelModeT">选择</span></div>
      <div class="fbtn" id="btnSettings"><svg class="ic"><use href="#i-gear"/></svg><span id="btnSettingsT">设置</span></div>
    </div>
  </aside>
  <!-- 侧栏宽度拖拽条（4px，叠加在两栏间隙上不占位）：拖拽调整 / 双击重置缺省宽 -->
  <div class="splitter" id="splitter" title="拖拽调整侧栏宽度（双击重置）"></div>

  <section class="ed empty" id="ed">
    <svg class="ic"><use href="#i-note"/></svg>
    <div>选择左侧一条笔记查看和编辑</div>
    <div style="font-size:11px">点侧栏顶部 + 新建笔记（先开草稿，输入内容才落库）；正文划选文字可弹出快速记录卡片</div>
  </section>
</div>
<div class="hintbar"><span id="hintSelect">🖱 在右侧正文<b>划选文字松手</b> → 弹出快速记录卡片</span><span id="hintDrag">拖笔记 → 文件夹移入 / 拖到根级笔记区移出</span><span id="hintFolder">点击展开/折叠 · 行尾漏斗进文件夹视图 · 右键管理</span><span id="hintKeys">Ctrl K 搜索 · Alt N 新建 · j/k 移动 · Enter 打开 · Esc 关闭浮层 · ? 快捷键</span></div>
<div id="capHost"></div>
<div id="modalHost"></div>
<div id="ctxHost"></div>
<div class="selbar" id="selbar" style="display:none"><span class="n" id="selbarN">已选 0 条</span><span class="syswarn" id="selSysWarn" style="display:none"></span><button class="mbtn primary" id="selMerge">合并</button><button class="mbtn danger" id="selDelete">删除</button><button class="mbtn" id="selCancel">取消</button></div>
<div class="toast" id="toast"></div>

<script>
