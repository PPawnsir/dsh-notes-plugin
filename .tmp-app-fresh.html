    + '<div class="modal-err" id="mErr" style="display:none"></div>'
    + '<div class="modal-acts"><button class="mbtn" id="trashClose">' + t('common.close') + '</button></div>'
  );
  $('modal').classList.add('trash');
  $('trashClose').onclick = function () { if (!trashState || !trashState.pending) { closeModal(); trashState = null } };
  loadTrash();
}
function loadTrash() {
  rpc('notes-list', { includeDeleted: true }).then(function (res) {
    if (!trashState) return;
    if (res && res.error) { trashState.list = []; renderTrashList(); modalErr(res.error); return }
    trashState.list = ((res && res.notes) || []).filter(function (n) { return n.deleted === true });
    trashState.list.sort(function (a, b) { return String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')) });   /* 删除时间（updatedAt 近似）降序 */
    /* 列表刷新后清洗勾选/预览态：已不在回收站的 id 剔除（单条恢复/彻底删除后残留勾选会误伤后续批量操作） */
    var alive = {}; trashState.list.forEach(function (n) { alive[n.id] = true });
    Object.keys(trashState.sel).forEach(function (id) { if (!alive[id]) delete trashState.sel[id] });
    if (trashState.preview && !alive[trashState.preview.id]) trashState.preview = null;
    renderTrashList();
  }).catch(function (e) { if (trashState) { trashState.list = []; renderTrashList(); modalErr(t('inj.loadFailed', { msg: e && e.message || e })) } });
}
/* 回收站列表（复用归档预览的列表样式 arch-list/arch-row）：批量条（全选 + 计数 + 批量恢复/彻底删除）+ 行 = 勾选 + 标题（点击预览）+ 删除时间 + 预览/恢复/彻底删除按钮 */
function renderTrashList() {
  var host = $('trashList'); if (!host || !trashState) return;
  var list = trashState.list || [];
  if (!list.length) { host.innerHTML = '<div class="modal-hint">' + t('trash.empty') + '</div>'; return }
  var selCnt = Object.keys(trashState.sel).length;
  var allChecked = list.every(function (n) { return trashState.sel[n.id] });
  host.innerHTML = '<div class="trash-batch">'
      + '<label class="trash-all"><input type="checkbox" id="trashAll"' + (allChecked ? ' checked' : '') + (trashState.pending ? ' disabled' : '') + '>' + t('inj.selectAll') + '</label>'
      + '<span class="selcnt">' + t('sel.selCount', { n: selCnt }) + '</span>'
      + '<button class="mbtn trash-act" id="trashRestoreBatch"' + (trashState.pending || selCnt < 1 ? ' disabled' : '') + '>' + t('trash.restoreSel') + '</button>'
      + '<button class="mbtn danger trash-act" id="trashPurgeBatch"' + (trashState.pending || selCnt < 1 ? ' disabled' : '') + '>' + t('trash.purgeSel') + '</button></div>'
    + '<div class="arch-list">'
    + list.map(function (n) {
        var pv = trashState.preview && trashState.preview.id === n.id ? trashState.preview : null;
        var html = '<div class="arch-row"><input type="checkbox" class="trash-check" data-id="' + esc(n.id) + '"' + (trashState.sel[n.id] ? ' checked' : '') + (trashState.pending ? ' disabled' : '') + '>'
          + '<span class="ti trash-ti" data-id="' + esc(n.id) + '" title="' + esc(t('trash.titleTip', { title: n.title || 'Untitled' })) + '">' + esc(n.title || 'Untitled') + '</span>'
          + '<span class="meta">' + esc(t('trash.deletedAt', { time: n.updatedAt ? fmtDT(n.updatedAt).slice(0, 10) : '—' })) + '</span>'
          + '<button class="mbtn trash-act" data-id="' + esc(n.id) + '" data-act="preview"' + (trashState.pending ? ' disabled' : '') + '>' + (pv ? t('trash.collapse') : t('trash.preview')) + '</button>'
          + '<button class="mbtn trash-act" data-id="' + esc(n.id) + '" data-act="restore"' + (trashState.pending ? ' disabled' : '') + '>' + t('trash.restore') + '</button>'
          + '<button class="mbtn danger trash-act" data-id="' + esc(n.id) + '" data-act="purge"' + (trashState.pending ? ' disabled' : '') + '>' + t('trash.purge') + '</button></div>';
        /* 行内只读预览：正文只经 renderMarkdown 内核渲染（全量转义，esc 先行零注入面）；加载/错误态经 esc() 文本插入 */
        if (pv) html += '<div class="trash-preview rich">' + (typeof pv.body === 'string' ? renderMarkdown(pv.body, wikiResolve) : '<span class="modal-hint">' + esc(pv.error || t('trash.previewLoading')) + '</span>') + '</div>';
        return html
      }).join('') + '</div>';
  $('trashAll').onchange = toggleTrashAll;
  $('trashRestoreBatch').onclick = doTrashRestoreBatch;
  $('trashPurgeBatch').onclick = doTrashPurgeBatch;
  host.querySelectorAll('.trash-check').forEach(function (el) { el.onchange = function () { toggleTrashSel(el.dataset.id) } });
  host.querySelectorAll('.trash-ti').forEach(function (el) { el.onclick = function () { toggleTrashPreview(el.dataset.id) } });
  host.querySelectorAll('.trash-act[data-act]').forEach(function (el) {
    el.onclick = function () {
      var id = el.dataset.id, n = list.find(function (x) { return x.id === id });
      if (el.dataset.act === 'restore') doTrashRestore(id);
      else if (el.dataset.act === 'purge') doTrashPurge(id, n && n.title);
      else toggleTrashPreview(id);
    };
  });
}
/* 行勾选/全选（trashState.sel: id→true；全选 = 当前列表全部勾选时再点则清空） */
function toggleTrashSel(id) { if (!trashState || trashState.pending) return; if (trashState.sel[id]) delete trashState.sel[id]; else trashState.sel[id] = true; renderTrashList() }
function toggleTrashAll() {
  if (!trashState || !trashState.list || trashState.pending) return;
  var all = trashState.list.length > 0 && trashState.list.every(function (n) { return trashState.sel[n.id] });
  trashState.sel = {};
  if (!all) trashState.list.forEach(function (n) { trashState.sel[n.id] = true });
  renderTrashList();
}
/* 行预览：notes-get {id, includeDeleted:true}（host includeDeleted 路径，已删正文只读可达；墓碑仍拒绝）→ renderMarkdown 只读渲染；再点收起 */
function toggleTrashPreview(id) {
  if (!trashState) return;
  if (trashState.preview && trashState.preview.id === id) { trashState.preview = null; renderTrashList(); return }
  trashState.preview = { id: id, body: null, error: '' };
  renderTrashList();
  rpc('notes-get', { id: id, includeDeleted: true }).then(function (res) {
    if (!trashState || !trashState.preview || trashState.preview.id !== id) return;
    if (res && res.note && typeof res.note.body === 'string') trashState.preview.body = res.note.body;
    else trashState.preview.error = t('trash.previewFailed', { msg: (res && res.error) || t('trash.noBody') });
    renderTrashList();
  }).catch(function (e) {
    if (!trashState || !trashState.preview || trashState.preview.id !== id) return;
    trashState.preview.error = t('trash.previewFailed', { msg: e && e.message || e });
    renderTrashList();
  });
}
function doTrashRestore(id) {
  if (!trashState || trashState.pending) return;
  trashState.pending = id; renderTrashList();
  rpc('notes-restore', { id: id }).then(function (res) {
    if (!trashState) return;
    trashState.pending = '';
    if (res && res.error) { modalErr(res.error); renderTrashList(); return }
    toast(t('meta.restored'));
    loadTrash(); loadNotes(true);
  }).catch(function (e) { if (trashState) { trashState.pending = ''; modalErr(t('meta.restoreFailed', { msg: e && e.message || e })); renderTrashList() } });
}
function doTrashPurge(id, title) {
  if (!trashState || trashState.pending) return;
  if (!confirm(t('trash.purgeConfirm', { title: title || id }))) return;
  trashState.pending = id; renderTrashList();
  rpc('notes-purge', { id: id }).then(function (res) {
    if (!trashState) return;
    trashState.pending = '';
    if (res && res.error) { modalErr(res.error); renderTrashList(); return }
    toast(t('trash.purged'));
    loadTrash(); loadNotes(true);
  }).catch(function (e) { if (trashState) { trashState.pending = ''; modalErr(t('meta.deleteFailed', { msg: e && e.message || e })); renderTrashList() } });
}
/* 批量恢复：confirm 后逐条 notes-restore（单条失败计数不中断）；完成后清空勾选/预览 + 刷新 */
function doTrashRestoreBatch() {
  if (!trashState || trashState.pending) return;
  var ids = Object.keys(trashState.sel);
  if (!ids.length) return;
  if (!confirm(t('trash.restoreBatchConfirm', { n: ids.length }))) return;
  trashState.pending = 'batch'; renderTrashList();
  var ok = 0, fail = 0, seq = Promise.resolve();
  ids.forEach(function (id) {
    seq = seq.then(function () {
      return rpc('notes-restore', { id: id }).then(function (res) { if (res && res.error) fail++; else ok++ }, function () { fail++ });
    });
  });
  seq.then(function () {
    if (!trashState) return;
    trashState.pending = ''; trashState.sel = {}; trashState.preview = null;
    toast(t('common.restoredBatch', { ok: ok }) + (fail ? t('inj.batchDoneFail', { n: fail }) : ''));
    loadTrash(); loadNotes(true);
  });
}
/* 批量彻底删除：confirm 双确认（「不可恢复 + 含历史版本」+ 条数，与单条同口径）→ 逐条 notes-purge（host 安全闸仅限已软删除） */
function doTrashPurgeBatch() {
  if (!trashState || trashState.pending) return;
  var ids = Object.keys(trashState.sel);
  if (!ids.length) return;
  if (!confirm(t('trash.purgeBatchConfirm', { n: ids.length }))) return;
  trashState.pending = 'batch'; renderTrashList();
  var ok = 0, fail = 0, seq = Promise.resolve();
  ids.forEach(function (id) {
    seq = seq.then(function () {
      return rpc('notes-purge', { id: id }).then(function (res) { if (res && res.error) fail++; else ok++ }, function () { fail++ });
    });
  });
  seq.then(function () {
    if (!trashState) return;
    trashState.pending = ''; trashState.sel = {}; trashState.preview = null;
    toast(t('trash.purgedBatch', { ok: ok }) + (fail ? t('inj.batchDoneFail', { n: fail }) : ''));
    loadTrash(); loadNotes(true);
  });
}

/* ================= 整理建议（设置卡片「整理建议」行入口）：notes-suggest（dry-run 零写入）四段式 modal =================
   契约：{ archiveCandidates:速记组（结构与 notes-archive-preview 同源）, staleCandidates:过期未引用, orphanCandidates:孤儿（仅展示）, logHygieneCandidates:{weekly,monthly}:日志卫生（工作记忆 v0，仅展示明细）, generatedAt }
   红线：只提名不自动执行——速记组「去归档」直达归档预览对话框；过期未引用「一键批量软删除」无 confirm 直接逐条 notes-delete（软删可恢复，撤销 toast 兜底——确认强度 = 不可恢复性，notes-034-c-confirm）；
   孤儿候选是启发式判定（可能误伤），不提供批量操作，逐条跳转人工过目；日志卫生 v0 仅展开明细（聚合执行留待 Phase 2，日志只聚合不淘汰）。 */
function openSuggest() {
  suggestState = { data: null, pending: false, logHgExpand: {} };
  openModal(
    '<div class="modal-t">' + icon('i-sparkle', 13) + ' ' + t('settings.suggest') + '<span class="sub">' + t('sugg.sub') + '</span></div>'
    + '<div id="suggestList"><div class="modal-hint">' + t('sugg.analyzing') + '</div></div>'
    + '<div class="modal-err" id="mErr" style="display:none"></div>'
    + '<div class="modal-acts"><button class="mbtn" id="suggestClose">' + t('common.close') + '</button></div>'
  );
  $('suggestClose').onclick = function () { if (!suggestState || !suggestState.pending) { closeModal(); suggestState = null } };
  loadSuggest();
}
function loadSuggest() {
  var empty = { archiveCandidates: [], staleCandidates: [], orphanCandidates: [], logHygieneCandidates: { weekly: [], monthly: [] } };
  rpc('notes-suggest', {}).then(function (res) {
    if (!suggestState) return;
    if (res && res.error) { suggestState.data = empty; renderSuggestList(); modalErr(res.error); return }
    suggestState.data = res || empty;
    renderSuggestList();
  }).catch(function (e) { if (suggestState) { suggestState.data = empty; renderSuggestList(); modalErr(t('sugg.failed', { msg: e && e.message || e })) } });
}
/* 四段式列表（复用 arch-list/arch-row）：① 速记组（「去归档」直达归档预览，数据同源）② 过期未引用（一键批量软删，无 confirm + 撤销 toast）③ 可能无用（仅展示，逐条「查看」跳转）④ 日志卫生（工作记忆 v0：超窗日志 周/月 聚合提名——只提名不执行，v0 「明细」展开逐条「查看」） */
function renderSuggestList() {
  var host = $('suggestList'); if (!host || !suggestState) return;
  var d = suggestState.data;
  if (!d) { host.innerHTML = '<div class="modal-hint">' + t('sugg.analyzing') + '</div>'; return }
  var arch = d.archiveCandidates || [], stale = d.staleCandidates || [], orphans = d.orphanCandidates || [];
  /* 工作记忆 v0 日志卫生（第四段）：{ weekly, monthly } 两级提名（裁决 B② 只提名不执行；v0 仅展示明细，聚合执行留待 Phase 2） */
  var logHg = d.logHygieneCandidates || { weekly: [], monthly: [] };
  var logHgGroups = logHg.weekly.map(function (g) { return { g: g, tier: t('sugg.tierWeekly') } }).concat(logHg.monthly.map(function (g) { return { g: g, tier: t('sugg.tierMonthly') } }));
  if (!arch.length && !stale.length && !orphans.length && !logHgGroups.length) { host.innerHTML = '<div class="modal-hint">' + t('sugg.clean') + '</div>'; return }
  var h = '';
  /* ① 可整理的速记组 */
  h += '<div class="sg-sec"><div class="sg-sec-t">' + t('sugg.secArch') + '<span class="sg-sec-n">' + t('sugg.countGroups', { n: arch.length }) + '</span>'
    + (arch.length ? '<button class="mbtn trash-act" id="sgGoArch">' + t('sugg.goArch') + '</button>' : '') + '</div>';
  h += arch.length
    ? '<div class="arch-list">' + arch.map(function (g) {
        var span = g.dateSpan && g.dateSpan.from ? (g.dateSpan.from === g.dateSpan.to ? g.dateSpan.from : g.dateSpan.from + ' ~ ' + g.dateSpan.to) : '';
        return '<div class="arch-row"><span class="ti" title="' + esc(g.title) + '">' + esc(g.title) + '</span>'
          + '<span class="meta">' + esc(t('arch.groupMeta', { span: span, n: g.members.length, size: fmtBytes(g.totalBytes) })) + ((g.totalUseCount || 0) > 0 ? esc(t('arch.groupUseCount', { n: g.totalUseCount })) : '') + '</span></div>'
      }).join('') + '</div>'
    : '<div class="modal-hint">' + t('arch.empty') + '</div>';
  h += '</div>';
  /* ② 过期未引用（useCount=0 且超 staleDays；一键批量软删，无 confirm + 撤销 toast 兜底） */
  h += '<div class="sg-sec"><div class="sg-sec-t">' + t('sugg.secStale') + '<span class="sg-sec-n">' + t('sugg.countItems', { n: stale.length }) + '</span>'
    + (stale.length ? '<button class="mbtn danger trash-act" id="sgBatchDel"' + (suggestState.pending ? ' disabled' : '') + '>' + (suggestState.pending ? t('sugg.deleting') : t('sugg.batchDel')) + '</button>' : '') + '</div>';
  h += stale.length
    ? '<div class="arch-list">' + stale.map(function (n) {
        return '<div class="arch-row"><span class="ti" title="' + esc(n.title || 'Untitled') + '">' + esc(n.title || 'Untitled') + '</span>'
          + '<span class="meta">' + esc(n.topic || t('meta.uncategorized')) + ' · ' + t('sugg.staleDays', { n: n.staleDays }) + '</span></div>'
      }).join('') + '</div>'
    : '<div class="modal-hint">' + t('sugg.staleEmpty') + '</div>';
  h += '</div>';
  /* ③ 可能无用（孤儿候选：启发式判定可能误伤——仅展示逐条「查看」，不提供批量操作） */
  h += '<div class="sg-sec"><div class="sg-sec-t">' + t('sugg.secOrphan') + '<span class="sg-sec-n">' + t('sugg.countItems', { n: orphans.length }) + '</span></div>';
  h += orphans.length
    ? '<div class="arch-list">' + orphans.map(function (n) {
        return '<div class="arch-row"><span class="ti" title="' + esc(n.title || 'Untitled') + '">' + esc(n.title || 'Untitled') + '</span>'
          + '<span class="meta">' + esc(n.topic || t('meta.uncategorized')) + ' · ' + esc(n.updatedAt ? fmtDT(n.updatedAt).slice(0, 10) : '—') + '</span>'
          + '<button class="mbtn trash-act sg-view" data-id="' + esc(n.id) + '">' + t('sugg.view') + '</button></div>'
      }).join('') + '</div>'
    : '<div class="modal-hint">' + t('sugg.orphanEmpty') + '</div>';
  h += '</div>';
  /* ④ 日志卫生（工作记忆 v0 裁决 B②：超窗旧日志两级聚合提名——只提名不执行，v0 展开明细逐条过目；日志只聚合不淘汰，永不进过期/孤儿候选） */
  h += '<div class="sg-sec"><div class="sg-sec-t">' + t('sugg.secLogHg') + '<span class="sg-sec-n">' + t('sugg.countGroups', { n: logHgGroups.length }) + '</span></div>';
  h += logHgGroups.length
    ? '<div class="arch-list">' + logHgGroups.map(function (x) {
        var g = x.g, gk = x.tier + g.key;
        var rows = '<div class="arch-row"><span class="ti" title="' + esc(g.title) + '">' + esc(g.title) + '</span>'
          + '<span class="meta">' + esc(t('sugg.logHgMeta', { tier: x.tier, n: g.members.length })) + '</span>'
          + '<button class="mbtn trash-act sg-loghg" data-gk="' + esc(gk) + '">' + (suggestState.logHgExpand && suggestState.logHgExpand[gk] ? t('trash.collapse') : t('sugg.detail')) + '</button></div>';
        if (suggestState.logHgExpand && suggestState.logHgExpand[gk]) {
          rows += g.members.map(function (m) {
            return '<div class="arch-row"><span class="ti" title="' + esc(m.title || 'Untitled') + '" style="padding-left:14px">' + esc(m.title || 'Untitled') + '</span>'
              + '<span class="meta">' + esc(m.logDate || '—') + (m.sessionId ? esc(t('sugg.sessSeg', { id: String(m.sessionId).replace(/^session-/, '').slice(0, 8) })) : '') + '</span>'
              + '<button class="mbtn trash-act sg-view" data-id="' + esc(m.id) + '">' + t('sugg.view') + '</button></div>'
          }).join('');
        }
        return rows
      }).join('') + '</div>'
    : '<div class="modal-hint">' + t('sugg.logHgEmpty') + '</div>';
  h += '</div>';
  h += '<div class="modal-hint">' + t('sugg.criteria') + '</div>';
  host.innerHTML = h;
  var go = $('sgGoArch'); if (go) go.onclick = function () { closeModal(); suggestState = null; openArchive() };   /* 直达归档预览（数据与 notes-archive-preview 同源） */
  var bd = $('sgBatchDel'); if (bd) bd.onclick = doSuggestBatchDelete;
  host.querySelectorAll('.sg-view').forEach(function (el) {
    el.onclick = function () { var id = el.dataset.id; closeModal(); suggestState = null; selectNote(id) };
  });
  /* 日志卫生组「明细」展开/收起（v0 仅展示明细，不提供聚合执行按钮） */
  host.querySelectorAll('.sg-loghg').forEach(function (el) {
    el.onclick = function () {
      var gk = el.dataset.gk;
      suggestState.logHgExpand = suggestState.logHgExpand || {};
      if (suggestState.logHgExpand[gk]) delete suggestState.logHgExpand[gk]; else suggestState.logHgExpand[gk] = true;
      renderSuggestList();
    };
  });
}
/* 过期未引用一键批量软删：确认强度 = 不可恢复性（notes-034-c-confirm）——软删可恢复 → 轻：无 confirm 直接删，
   撤销 toast 兜底（逐条 notes-restore；回收站亦可恢复）；删后刷新建议 + 列表 */
function doSuggestBatchDelete() {
  if (!suggestState || suggestState.pending || !suggestState.data) return;
  var list = suggestState.data.staleCandidates || [];
  if (!list.length) return;
  suggestState.pending = true; renderSuggestList();
  var ok = 0, fail = 0, okIds = [], chain = Promise.resolve();
  list.forEach(function (n) {
    chain = chain.then(function () {
      return rpc('notes-delete', { id: n.id }).then(function (res) { if (res && res.error) fail++; else { ok++; okIds.push(n.id) } }, function () { fail++ });
    });
  });
  chain.then(function () {
    if (!suggestState) return;
    suggestState.pending = false;
    toast(t('sugg.softDeleted', { ok: ok }) + (fail ? t('inj.batchDoneFail', { n: fail }) : ''), okIds.length ? { label: t('meta.undo'), fn: function () { undoSuggestBatchDelete(okIds) } } : undefined);
    loadSuggest(); afterArchiveRefresh();
  });
}
/* 建议器批量软删撤销：逐条 notes-restore 恢复本次成功删除的笔记，恢复后刷新建议 + 列表 */
function undoSuggestBatchDelete(ids) {
  var ok = 0, fail = 0, chain = Promise.resolve();
  ids.forEach(function (id) {
    chain = chain.then(function () {
      return rpc('notes-restore', { id: id }).then(function (res) { if (res && res.error) fail++; else ok++ }, function () { fail++ });
    });
  });
  chain.then(function () {
    toast(t('common.restoredBatch', { ok: ok }) + (fail ? t('inj.batchDoneFail', { n: fail }) : ''));
    loadSuggest(); afterArchiveRefresh();
  });
}

/* ================= 快速记录卡片（v2）：正文划选松手触发 ================= */
var capEl = null, capText = '';
document.addEventListener('mouseup', function (ev) {
  if (capEl && capEl.contains(ev.target)) return;
  /* .rich/.rtb 排除：富文本编辑器的划选归工具栏所有（加粗/链接等），不弹速记卡（v3） */
  if (ev.target.closest && ev.target.closest('input,textarea,select,.modal,.ctxmenu,.rich,.rtb')) return;
  var sel = window.getSelection();
  var txt = sel && !sel.isCollapsed ? String(sel).trim() : '';
  if (!txt || txt.length < 2) return;
  var rect = sel.getRangeAt(0).getBoundingClientRect();

  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
});
/* 双击分隔条 = 重置缺省宽度（并清除持久化） */
splitterEl.addEventListener('dblclick', function () { applySideW(SIDE_W_DEFAULT); saveSideW(null) });
/* 窗口 resize 按新 60% 上限复核（不回写持久化，窗口放大后恢复原宽） */
window.addEventListener('resize', function () { applySideW(sideEl.getBoundingClientRect().width) });
loadSideW();
function applyTheme(t) { document.documentElement.dataset.theme = t; try { localStorage.setItem('dsh-notes-app-theme', t) } catch (e) {} }
$('btnTheme').addEventListener('click', function () { applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark') });
try { var savedTheme = localStorage.getItem('dsh-notes-app-theme'); if (savedTheme === 'light' || savedTheme === 'dark') applyTheme(savedTheme) } catch (e) {}

/* ================= 键盘 ================= */
/* 列表键盘导航（R-4 兑现）：j/k 或 ↑↓ 移动焦点行（可见选中态 .focused），Enter 打开；
   可见行序 = DOM 序（置顶/文件夹/未入夹/主题分组与展开态即所见顺序） */
function listVisibleIds() {
  return Array.prototype.map.call($('tree').querySelectorAll('[data-note]'), function (el) { return el.dataset.note })
}
function moveFocus(ids, delta) {
  var idx = focusId ? ids.indexOf(focusId) : -1;
  var next = idx < 0 ? (delta > 0 ? 0 : ids.length - 1) : Math.max(0, Math.min(ids.length - 1, idx + delta));
  if (ids[next] == null) return;
  focusId = ids[next];
  renderTree();
  var fel = $('tree').querySelector('[data-note="' + focusId + '"]');
  if (fel) fel.scrollIntoView({ block: 'nearest' });
}
/* Esc 焦点分层末段/搜索↓桥接共用：还焦列表容器（焦点不得滞留输入框，j/k 立即可用） */
function blurSearchToList() { $('q').blur(); $('tree').focus() }
document.addEventListener('keydown', function (ev) {
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); $('q').focus(); return }
  /* Alt+N 新建（Ctrl+N 是浏览器保留键「新建窗口」，页面 keydown 拿不到——改用无冲突组合；AltGr 带 ctrlKey 天然排除） */
  if (ev.altKey && !ev.ctrlKey && !ev.metaKey && (ev.key === 'n' || ev.key === 'N')) { ev.preventDefault(); if (!$('modalHost').firstChild) doNewNote(); return }
  /* v3：Ctrl+/ 双模式切换（源码⇄富文本）；降级时 switchMode 内部拦截并 toast（弹窗打开时不切） */
  if ((ev.ctrlKey || ev.metaKey) && ev.key === '/') { ev.preventDefault(); if (edNote && !$('modalHost').firstChild) switchMode(edMode === 'source' ? 'rich' : 'source'); return }
  if (ev.key === 'Escape') {
    if ($('modalHost').firstChild) { closeModalFlushed(); archState = null; trashState = null; injMgrState = null; suggestState = null; histState = null; memEnableState = null; dState = null; return }   /* 归档预览/合并/回收站/注入管理/整理建议/历史版本/工作记忆启用/派发（含定时排定）对话框走 modalHost，Esc 统一关（设置卡先兜底 flush 再关，同 ✕） */
    if (sortOpen) { sortOpen = false; renderFilterBar(); return }   /* 排序菜单 Esc（优先于筛选 popover） */
    if (filterOpen) { filterOpen = false; renderFilterBar(); return }   /* 筛选 popover Esc 关闭 */
    if (scopeOpen) { scopeOpen = false; renderScopePanel(); return }
    if (capEl) { closeCap(); return }
    if ($('ctxHost').firstChild) { closeCtx(); return }
    if (selMode) { selMode = false; selIds = {}; renderTree(); return }   /* Esc 退出多选态 */
    /* Esc 焦点分层末段：搜索框聚焦时——清空搜索并还焦列表（焦点不得滞留输入框，否则 j/k 字母误入搜索） */
    if (document.activeElement === $('q')) {
      if ($('q').value) { searchText = ''; searchIds = null; searchMeta = {}; $('q').value = ''; render() }
      blurSearchToList(); return
    }
    if (!document.activeElement || !document.activeElement.isContentEditable) { searchText = ''; searchIds = null; searchMeta = {}; $('q').value = ''; render() }
    return
  }
  /* 搜索框 ↓ 桥接列表（保留过滤上下文：搜索→↓→j/k→Enter 纯键盘路径） */
  var kt = ev.target;
  if (kt === $('q') && ev.key === 'ArrowDown') { ev.preventDefault(); blurSearchToList(); var ids0 = listVisibleIds(); if (ids0.length) moveFocus(ids0, 1); return }
  /* 列表导航：输入框/富文本内不抢键；弹窗/右键菜单打开时暂停 */
  var inField = kt && (kt.tagName === 'INPUT' || kt.tagName === 'TEXTAREA' || kt.isContentEditable);
  if (inField) return;
  /* ? 键唤起/关闭快捷键速查表（notes-034-f-cheatsheet：非输入焦点；其他弹层/右键菜单打开时不抢——Esc 分层口径同列表导航） */
  if (ev.key === '?') {
    ev.preventDefault();
    if ($('cheatsheetRoot')) { closeModalFlushed(); return }   /* 速查表打开时再按 ? = 关闭（toggle） */
    if ($('modalHost').firstChild || $('ctxHost').firstChild) return;   /* 其他弹层/右键菜单打开时不抢键 */
    openCheatsheet(); return
  }
  if ($('modalHost').firstChild || $('ctxHost').firstChild) return;
  var ids = listVisibleIds();
  if (!ids.length) return;
  if (ev.key === 'j' || ev.key === 'ArrowDown') { ev.preventDefault(); moveFocus(ids, 1) }
  else if (ev.key === 'k' || ev.key === 'ArrowUp') { ev.preventDefault(); moveFocus(ids, -1) }
  else if (ev.key === 'Enter') { if (focusId && ids.indexOf(focusId) >= 0) selectNote(focusId) }
});
/* ================= 启动 ================= */
/* v3：document 级 selectionchange 挂一次（renderEd 重建编辑器 DOM 时元素级监听随元素重建，document 级不累积） */
document.addEventListener('selectionchange', function () {
  var rich = $('edRich');
  if (!rich || edMode !== 'rich') return;
  var sel = window.getSelection();
  if (sel && sel.rangeCount && rich.contains(sel.anchorNode)) { keepSel(); updateToolbarState(); }
});
/* 0.4.3⑦：日志同权 + 文件视图拆除——render 不再做日志口径翻转检测（maybeReloadForLogs 已随 data.js 一并拆除），纯渲染汇聚 */
function render() { renderTree(); if (edNote) renderMeta() }
loadNotes();
</script>
