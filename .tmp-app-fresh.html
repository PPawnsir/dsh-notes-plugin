<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dsh-notes</title>
<!--
  dsh-notes 半独立全窗口笔记页（/dsh-notes-app）
  - UI 基座：design/notes-ui-v2.html 定稿原型（原生 JS+DOM / DSH token 配色 / SVG 图标）
  - 数据层：mock 整体替换为 /dsh-notes RPC（POST {method,args}），复用 index.mjs 全部现有 handler
  - 与浮动面板并存：面板走 client bundle，本页是全窗口入口；无会话上下文（sessionId/cwd 传空）
-->
<style>
  :root{
    --nfont:-apple-system,"SF Pro Text","Segoe UI","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
    --nmono:ui-monospace,"Cascadia Code",Consolas,monospace;
    --nr-lg:12px; --nr-md:8px; --nr-sm:6px;
  }
  html[data-theme="dark"]{
    /* DSH 0.1.7 暗色实机值（与面板 token 解析一致）：bg-base/layer-1/layer-2 + 官方交互 hover + 业务主色鲜蓝 */
    --nbg:#151517; --npanel:#232324; --nbg-raise:#2c2c2e; --nbg-hover:#ffffff14; --nbg-sel:rgba(122,170,255,.14);
    --ntx:#f9fafb; --nt2:#cfd3d6; --nt3:#adb2b8; --nbd:#ffffff1f; --nbd-soft:#ffffff29;
    --nacc:#7aaaff; --nacc-tx:#96bcfe; --nwarn:#e5b567; --ndanger:#e5734f;
    --kind-note:#8f8fa3; --kind-decision:#e5b567; --kind-todo:#6c8cff; --kind-link:#56c8d8; --kind-quote:#b58fe5; --kind-log:#a89ff5; --kind-sys:#9aa0a6;
  }
  html[data-theme="light"]{
    /* DSH 0.1.7 亮色实机值：layer 系同为 #fff，容器底/抬升面按实机 color-mix（ntx 6%/4%）折算 */
    --nbg:#f1f1f1; --npanel:#ffffff; --nbg-raise:#f5f5f6; --nbg-hover:#2631480f; --nbg-sel:rgba(65,118,230,.14);
    --ntx:#0f1115; --nt2:#61666b; --nt3:#81858c; --nbd:#0000001a; --nbd-soft:#0000001f;
    --nacc:#4176e6; --nacc-tx:#3660b8; --nwarn:#b07f1e; --ndanger:#cf5b34;
    --kind-note:#8f8f9c; --kind-decision:#b07f1e; --kind-todo:#4062e8; --kind-link:#1e9aab; --kind-quote:#8a5cd6; --kind-log:#6c63e0; --kind-sys:#6e6e73;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--nfont);background:var(--nbg);color:var(--ntx);height:100vh;overflow:hidden;font-size:13px;display:flex;flex-direction:column}
  svg.ic{width:15px;height:15px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  /* ===== 顶栏（全窗口页面身份；原型 proto-bar 的正装版） ===== */
  .topbar{display:flex;gap:10px;align-items:center;padding:8px 14px;background:var(--npanel);border-bottom:1px solid var(--nbd);font-size:12px;color:var(--nt2)}
  .topbar .logo{width:20px;height:20px;border-radius:5px;background:var(--nacc);display:grid;place-items:center;color:#fff}
  .topbar .logo svg.ic{width:12px;height:12px}
  .topbar b{color:var(--ntx);font-size:13px}
  .topbar .sub{color:var(--nt3);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .topbar .sp{flex:1}
  /* 窄宽防竖排（notes-041-topbar-400）：按钮文字 nowrap + flex-shrink:0，不再被压成逐字竖排；≤480px 断点下次要按钮（.ico-only：切换主题/DSH 主界面）收起文字只留图标（title 提示保留），刷新/速记保文字，副标题隐去 */
  .tbtn{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:11.5px;color:var(--ntx);background:var(--nbg-raise);border:1px solid var(--nbd);border-radius:var(--nr-sm);padding:4px 12px;cursor:pointer;text-decoration:none;white-space:nowrap;flex-shrink:0}
  .tbtn:hover{background:var(--nbg-hover)}
  .tbtn svg.ic{width:12px;height:12px}
  @media (max-width:480px){
    .topbar .sub{display:none}
    .tbtn.ico-only{padding:4px 8px}
    .tbtn.ico-only .tb-t{display:none}
  }
  /* ===== 主体两栏 ===== */
  .app{flex:1;display:flex;min-height:0;padding:10px;gap:10px}
  .side{width:342px;flex-shrink:0;background:var(--npanel);border-radius:var(--nr-lg);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--nbd-soft)}
  /* ===== 侧栏宽度拖拽条（4px，叠加在两栏 10px 间隙上不占位——宽 4px + 双侧 -7px margin 抵消 gap；hover/拖拽中高亮；双击重置缺省 342px） ===== */
  .splitter{width:4px;margin:0 -7px;flex-shrink:0;cursor:col-resize;z-index:5;border-radius:2px;transition:background .15s}
  .splitter:hover,.splitter.on{background:var(--nacc)}
  body.split-drag,body.split-drag *{cursor:col-resize!important;user-select:none!important;-webkit-user-select:none!important}
  .brand{display:flex;align-items:center;gap:8px;padding:13px 14px 9px}
  .brand .logo{width:22px;height:22px;border-radius:6px;background:var(--nacc);display:grid;place-items:center;color:#fff}
  .brand b{font-size:13px} .brand .cnt{margin-left:auto;font-size:11px;color:var(--nt3)}
  /* 新建入口（自旧 chips 行迁入 brand 行右侧，筛选中心落地口径⑥） */
  .brand .add-new{color:var(--nt3);cursor:pointer;padding:2px;border-radius:4px;display:grid;place-items:center;flex-shrink:0}
  .brand .add-new:hover{color:var(--nacc);background:var(--nbg-hover)}
  .brand .add-new svg.ic{width:13px;height:13px}
  .quick{margin:0 10px 8px;display:flex;align-items:center;gap:7px;background:var(--nbg-raise);border:1px solid var(--nbd-soft);border-radius:var(--nr-md);padding:6px 10px}
  .quick:focus-within{border-color:var(--nacc)}
  .quick input{flex:1;border:0;outline:0;background:transparent;color:var(--ntx);font:inherit;font-size:12px}
  .quick input::placeholder{color:var(--nt3)}
  .quick .kbd{font-family:var(--nmono);font-size:10px;background:var(--nbg);border:1px solid var(--nbd);border-radius:4px;padding:1px 5px;color:var(--nt3)}
  /* ===== 筛选中心（design/notes-filter-center.html 定稿落地）：筛选按钮(N) + 激活条件 chips（单行横滚）+ 独立排序控件；popover 浮层不挤压树区 ===== */
  /* 硬性布局约束：chips 过多单行横向滚动，树区高度不受影响（filterbar 不换行、flex-shrink:0；fpop/fsort-menu 均 absolute 浮层） */
  .filterbar{position:relative;display:flex;align-items:center;gap:5px;padding:0 10px 9px;flex-wrap:nowrap;flex-shrink:0}
  .fbtn-filter{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:11px;color:var(--nt2);background:var(--nbg-raise);border:1px solid var(--nbd);border-radius:20px;padding:3px 11px;cursor:pointer;flex-shrink:0}
  .fbtn-filter:hover{color:var(--ntx);background:var(--nbg-hover)}
  .fbtn-filter.on{background:var(--nbg-sel);border-color:transparent;color:var(--nacc-tx);font-weight:600}
  .fbtn-filter svg.ic{width:11px;height:11px}
  .fbtn-filter .cnt{font-family:var(--nmono);font-size:9.5px;line-height:1.4;background:var(--nacc);color:#fff;border-radius:8px;padding:0 5px}
  /* 激活条件 chips：单行横排，超宽横向滚动（不挤压树区高度）；× 单条移除，与 popover 勾选双向同步 */
  .fchips{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:thin}
  .fchip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 4px 2px 9px;border-radius:20px;background:var(--nbg-sel);color:var(--nacc-tx);flex-shrink:0;user-select:none;white-space:nowrap}
  .fchip svg.ic{width:10px;height:10px}
  .fchip .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .fchip .x{display:grid;place-items:center;width:14px;height:14px;border-radius:50%;cursor:pointer;opacity:.75}
  .fchip .x:hover{opacity:1;background:var(--nbg-hover);color:var(--ntx)}
  .fchip .x svg.ic{width:9px;height:9px}
  /* 独立排序控件（右端；非缺省排序或菜单打开时高亮；与筛选正交，互不重置） */
  .fsort-wrap{position:relative;flex-shrink:0}
  .fsort-btn{display:inline-flex;align-items:center;gap:4px;font:inherit;font-size:11px;color:var(--nt2);background:transparent;border:1px solid var(--nbd);border-radius:20px;padding:3px 10px;cursor:pointer}
  .fsort-btn:hover{color:var(--ntx);background:var(--nbg-hover)}
  .fsort-btn.on{color:var(--nacc-tx);border-color:var(--nacc)}
  .fsort-btn svg.ic{width:11px;height:11px}
  .fsort-menu{display:none;position:absolute;top:calc(100% + 4px);right:0;z-index:90;min-width:190px;background:var(--npanel);border:1px solid var(--nbd);border-radius:var(--nr-md);box-shadow:0 10px 32px rgba(0,0,0,.4);padding:4px}
  .fsort-menu.open{display:block;animation:popIn .12s ease}
  .fsort-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--nt2);padding:5px 9px;border-radius:var(--nr-sm);cursor:pointer;user-select:none}
  .fsort-item:hover{background:var(--nbg-hover);color:var(--ntx)}
  .fsort-item.on{color:var(--nacc-tx);font-weight:600}
  .fsort-item .tick{width:12px;visibility:hidden;display:grid;place-items:center}
  .fsort-item.on .tick{visibility:visible}
  .fsort-item .sd{margin-left:auto;font-size:10px;color:var(--nt3);font-weight:400}
  /* popover 分组面板（锚定筛选按钮下挂；覆盖树上、关闭即消失） */
  .fpop{display:none;position:absolute;top:calc(100% + 4px);left:10px;z-index:80;width:238px;background:var(--npanel);border:1px solid var(--nbd);border-radius:var(--nr-md);box-shadow:0 10px 32px rgba(0,0,0,.4);padding:6px 6px 0}
  .fpop.open{display:block;animation:popIn .12s ease}
  @keyframes popIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
  .fg-h{display:flex;align-items:baseline;justify-content:space-between;gap:6px;font-size:10px;color:var(--nt3);letter-spacing:.6px;padding:5px 8px 3px;text-transform:uppercase}
  .fg-rule{font-size:9.5px;letter-spacing:0;text-transform:none;opacity:.85;white-space:nowrap}
  .fg-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--nt2);padding:5px 8px;border-radius:var(--nr-sm);cursor:pointer;user-select:none}
  .fg-item:hover{background:var(--nbg-hover);color:var(--ntx)}
  .fg-item input{accent-color:var(--nacc);margin:0;flex-shrink:0}
  .fg-item .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .fg-item svg.ic{width:11px;height:11px;color:var(--nt3)}
  .fg-item .fl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fg-item .cnt2{font-size:10px;color:var(--nt3);flex-shrink:0}
  .fpop-foot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--nbd-soft);margin-top:6px;padding:7px 2px 8px}
  .fpop-foot .pcnt{flex:1;font-size:10.5px;color:var(--nt3)}
  .pbtn{font:inherit;font-size:11px;padding:3px 14px;border-radius:var(--nr-sm);border:1px solid var(--nbd);background:var(--nbg-raise);color:var(--nt2);cursor:pointer}
  .pbtn:hover{color:var(--ntx);background:var(--nbg-hover)}
  .pbtn.primary{background:var(--nacc);border-color:transparent;color:#fff;font-weight:600}
  .pbtn.primary:hover{opacity:.9}
  /* 搜索关键词高亮（先 esc 再包 <mark>，防 XSS——见 hl()） */
  .note-row .ti mark{background:rgba(255,213,79,.35);color:inherit;border-radius:2px;padding:0 1px}
  .tree{flex:1;overflow-y:auto;padding:0 6px 8px;border-top:1px solid var(--nbd-soft)}
  .tree:focus{outline:none}   /* 键盘流还焦目标（Esc/搜索↓ 还焦列表）：程序化焦点不画焦点环 */
  .sec-h{display:flex;align-items:center;gap:5px;padding:10px 10px 4px;font-size:10.5px;font-weight:600;letter-spacing:.8px;color:var(--nt3);text-transform:uppercase}
  .sec-h .add{margin-left:auto;color:var(--nt3);cursor:pointer;padding:0 3px;border-radius:4px}
  .sec-h .add:hover{color:var(--nacc);background:var(--nbg-hover)}
  /* 分组头计数丸（置顶；过滤激活时 = 命中数） */
  .sec-h .cnt2{margin-left:auto;font-size:10px;font-weight:400;letter-spacing:0;text-transform:none}
  .row{display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:var(--nr-sm);color:var(--nt2);cursor:default;user-select:none}
  .row:hover{background:var(--nbg-hover);color:var(--ntx)}
  /* 文件夹行（notes-tree-typography：同级字体统一 13px/常规/主色 --ntx，与笔记行一致；hover/激活态保留），层级靠缩进+图标表达 */
  .row.head{font-size:13px;color:var(--ntx)}
  .row.head.on{background:var(--nbg-sel);color:var(--nacc-tx)}
  .row.drop{outline:1.5px dashed var(--nacc);outline-offset:-2px}
  /* 未入夹笔记区：根级同级直显（无「未分类」分组头）；整区包裹容器 = 「移出文件夹」drop 落点；提示行仅拖拽中（.drag-on）显示 */
  .unfiled-drop{border-radius:var(--nr-sm)}
  .unfiled-drop.drop{outline:1.5px dashed var(--nacc);outline-offset:-2px}
  .unfiled-hint{display:none;margin:2px 0;padding:5px 8px;border:1px dashed var(--nbd);border-radius:var(--nr-sm);font-size:11px;color:var(--nt3);text-align:center;user-select:none}
  .unfiled-drop.drag-on .unfiled-hint{display:block}
  .unfiled-drop.drop .unfiled-hint{border-color:var(--nacc);color:var(--nacc-tx)}
  .caret{width:11px;flex-shrink:0;color:var(--nt3);display:grid;place-items:center;transition:transform .15s;cursor:pointer}
  .caret.open{transform:rotate(90deg)} .caret svg.ic{width:10px;height:10px}
  /* 行尾视图过滤图标（文件夹/主题行共用：单击行主体=原地展开，视图过滤降级为行尾小图标；hover 浮现，激活常显） */
  .vfilter{width:16px;height:16px;flex-shrink:0;display:grid;place-items:center;color:var(--nt3);border-radius:4px;cursor:pointer;opacity:0;transition:opacity .12s}
  .row:hover .vfilter{opacity:1}
  .vfilter:hover{color:var(--nacc);background:var(--nbg-hover)}
  .vfilter.on{opacity:1;color:var(--nacc)}
  .vfilter svg.ic{width:11px;height:11px}
  .row .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .row .n{font-size:10.5px;color:var(--nt3)}
  /* 行首槽位对齐（notes-tree-typography，VS Code 式）：caret 槽 11px 定宽（笔记行无折叠箭头，渲染同宽透明占位 .caret-spacer）、图标槽 16px 定宽（文件夹=folder 图标 / 笔记=kind 色点居中 .kind-slot）——同级行标题文字起点 x 一致 */
  .caret-spacer{width:11px;flex-shrink:0}
  .ic-slot{width:16px;flex-shrink:0;display:grid;place-items:center;color:var(--nt2)}
  .kind-slot{width:16px;flex-shrink:0;display:grid;place-items:center}
  .note-row{display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:var(--nr-sm);color:var(--ntx);cursor:default;user-select:none}
  .note-row:hover{background:var(--nbg-hover)}
  .note-row.sel{background:var(--nbg-sel)}
  .note-row.focused{background:var(--nbg-hover)}   /* 键盘焦点行（j/k/↑↓ 移动）：可见选中态；与已选行重叠时盖过 sel */
  .note-row .kind{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .note-row .ti{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .note-row .tp{font-size:10px;color:var(--nt3);flex-shrink:0;max-width:70px;overflow:hidden;text-overflow:ellipsis}
  .note-row .pin{width:10px;height:10px;flex-shrink:0;color:var(--nwarn)}
  /* 使用遥测（P2）：行尾被引用徽章（quote 图标 + 计数；0 次不渲染） */
  .note-row .use{display:flex;align-items:center;gap:2px;font-size:10px;color:var(--nt3);flex-shrink:0}
  .note-row .use svg.ic{width:9px;height:9px}
  .note-row.dim{opacity:.45}
  /* 0.4.4-D hidden 隐藏属性遮罩样式（notes-044-hidden-attr）：显隐开关开时 hidden 行半透明 + 标题虚线下划暗示（开关关时整行滤除不渲染） */
  .note-row.hid{opacity:.5}
  .note-row.hid .ti{border-bottom:1px dashed var(--nt3)}
  .row.head.hid{opacity:.5}
  .row.head.hid .nm{border-bottom:1px dashed var(--nt3)}
  .nested{margin-left:13px;padding-left:9px;border-left:1px solid var(--nbd-soft)}
  .nested .note-row{padding:3.5px 8px;font-size:12.5px}
  /* 嵌套子文件夹行（notes-nested-folder-ui）：与嵌套笔记行同小字口径（12.5px；同级统一，层级靠缩进+图标表达），行首槽位不变 */
  .nested .row.head{font-size:12.5px}
  /* 文件夹行拖拽源（换父拖拽进行中半透明，与笔记行 .drag 同口径） */
  .row.head.drag{opacity:.35}
  .fbadge{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--nt3);background:var(--nbg-raise);border:1px solid var(--nbd-soft);border-radius:4px;padding:0 5px;flex-shrink:0}
  .fbadge svg.ic{width:9px;height:9px}
  .note-row.drag{opacity:.35}
  /* ===== 多选合并（「选择」chip → 行首复选框 → 底部浮动操作条） ===== */
  .note-row.pick{background:var(--nbg-sel)}
  .pick-check{flex-shrink:0;accent-color:var(--nacc);cursor:pointer;margin:0}
  .selbar{position:fixed;left:22px;bottom:22px;z-index:110;width:316px;display:flex;align-items:center;gap:8px;background:var(--npanel);border:1px solid var(--nbd);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.30);padding:8px 12px}
  .selbar .n{flex:1;font-size:11.5px;color:var(--nt2)}
  /* 0.4.3⑥（notes-043-sys-kind）：多选含 kind=sys 系统根笔记红字警示（confirm 门槛在 doSelBatchDelete） */
  .selbar .syswarn{display:none;flex-shrink:0;max-width:110px;font-size:10.5px;line-height:1.25;color:var(--nwarn);cursor:help}
  /* ===== 归档预览对话框（组勾选/成员展开；复用 mask/modal） ===== */
  .arch-list{border:1px solid var(--nbd-soft);border-radius:var(--nr-md);margin-bottom:10px;max-height:300px;overflow-y:auto}
  .arch-group+.arch-group{border-top:1px solid var(--nbd-soft)}
  .arch-group.off{opacity:.5}
  .arch-row{display:flex;align-items:center;gap:7px;padding:7px 9px;font-size:12px}
  .arch-row .caret{cursor:pointer}
  .arch-row .ti{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-weight:600}
  .arch-row .meta{font-size:10.5px;color:var(--nt3);flex-shrink:0}
  .arch-members{padding:2px 9px 8px 34px}
  .arch-member{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--nt2);padding:2px 0}
  .arch-member .ti{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .arch-member .dt{font-size:10px;color:var(--nt3);flex-shrink:0}
  /* ===== P1 回收站（复用 arch-list/arch-row）：行内「恢复/彻底删除」小按钮 ===== */
  .arch-row .trash-act{margin-left:2px;padding:2px 10px;font-size:11px;flex-shrink:0}
  .arch-row .trash-act.danger{margin-left:0}
  /* ===== 回收站增强（notes-trash-batch-preview）：批量条（全选+选中计数+批量按钮）+ 行勾选 + 行内只读预览 ===== */
  .modal.trash{width:520px}
  .trash-batch{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:11.5px;color:var(--nt2)}
  .trash-all{display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
  .trash-batch .selcnt{flex:1;color:var(--nt3);font-size:11px}
  .trash-check{flex-shrink:0;accent-color:var(--nacc);cursor:pointer;margin:0}
  .arch-row .trash-ti{cursor:pointer}
  .arch-row .trash-ti:hover{color:var(--nacc-tx)}
  .trash-preview{margin:2px 4px 8px 26px;padding:10px 12px;font-size:12px;line-height:1.7;background:var(--nbg);border:1px solid var(--nbd-soft);border-radius:var(--nr-md);max-height:220px;overflow:auto;box-sizing:border-box}
  /* ===== 整理建议对话框（复用 arch-list/arch-row + trash-act）：三段分节标题 ===== */
  .sg-sec{margin-bottom:4px}
  .sg-sec-t{display:flex;align-items:center;gap:7px;padding:6px 2px;font-size:11.5px;font-weight:600;color:var(--ntx)}
  .sg-sec-n{font-size:10.5px;font-weight:400;color:var(--nt3)}
  .sg-sec-t .trash-act{margin-left:auto}
  .side-foot{padding:8px 10px;border-top:1px solid var(--nbd-soft);display:flex;gap:6px}
  .fbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;font-size:11px;color:var(--nt2);background:var(--nbg);border:1px solid var(--nbd-soft);border-radius:var(--nr-sm);padding:5px 0;cursor:pointer}
  .fbtn:hover{color:var(--nacc-tx);border-color:var(--nacc)} .fbtn svg.ic{width:12px;height:12px}
  .fbtn.on{color:var(--nacc-tx);border-color:var(--nacc);background:var(--nbg-sel)}   /* 「选择」多选态高亮（自旧 chips 行迁入 side-foot） */
  /* ===== 编辑器 ===== */
  .ed{flex:1;background:var(--npanel);border-radius:var(--nr-lg);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--nbd-soft)}
  .ed.empty{align-items:center;justify-content:center;color:var(--nt3);gap:8px}
  .ed.empty .ic{width:26px;height:26px}
  .ed-h{padding:16px 24px 0}
  .ed-crumb{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--nt3)}
  .ed-crumb .sep{opacity:.5} .ed-crumb .cur{color:var(--nt2)} .ed-crumb .lnk{color:var(--nacc-tx);cursor:pointer}
  .ed-title{margin-top:8px;font-size:21px;font-weight:700;line-height:1.3;outline:none;border-radius:var(--nr-sm);padding:2px 4px;margin-left:-4px}
  .ed-title:focus{background:var(--nbg-raise)} .ed-title:empty::before{content:var(--i18n-ed-title-ph,"无标题");color:var(--nt3)}
  .ed-meta{display:flex;align-items:center;gap:7px;margin-top:12px;padding-bottom:12px;border-bottom:1px solid var(--nbd-soft);flex-wrap:wrap}
  .meta-chip{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--nt2);background:var(--nbg-raise);border:1px solid var(--nbd-soft);border-radius:20px;padding:3px 10px;cursor:pointer}
  .meta-chip .dot{width:6px;height:6px;border-radius:50%}
  .meta-chip svg.ic{width:11px;height:11px}
  .meta-chip.tgl.on{background:var(--nbg-sel);border-color:transparent;color:var(--nacc-tx)}
  /* 注入三态分段控件（关闭/约定/资料）：选中段走 nbg-sel + nacc-tx token */
  .meta-chip.role-seg{padding:2px 3px;gap:2px}
  .role-seg .seg{padding:1px 8px;border-radius:13px;color:var(--nt3)}
  .role-seg .seg:hover{color:var(--ntx);background:var(--nbg-hover)}
  .role-seg .seg.on{background:var(--nbg-sel);color:var(--nacc-tx);font-weight:600}
  .meta-chip select,.meta-chip input{border:0;background:transparent;color:inherit;font:inherit;outline:0;cursor:pointer}
  .meta-chip input{cursor:text;min-width:0}
  .meta-chip input::placeholder{color:var(--nt3)}
  .meta-chip select option{color:var(--ntx);background:var(--npanel)}
  .meta-sp{flex:1}
  .meta-act{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--nt3);padding:3px 9px;border-radius:var(--nr-sm);cursor:pointer}
  .meta-act:hover{background:var(--nbg-hover);color:var(--ntx)}
  .meta-act.on{color:var(--nwarn)}
  .meta-act.danger:hover{color:var(--ndanger)}
  .meta-act svg.ic{width:12px;height:12px}
  /* 二期 ✨整理按钮：整理中态（忙） */
  .meta-act.organize-btn.busy{opacity:.62;cursor:default;pointer-events:none}
  /* ===== 双模式编辑器 v3（原型 design/notes-editor-v3.html；与面板 styles.css 同款无前缀；色板走上方 html[data-theme] 块，此处不加主题块以守住 v2 色板同步断言） ===== */
  .ed-main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
  .src{flex:1;width:100%;resize:none;border:0;outline:0;background:transparent;color:var(--ntx);font-family:var(--nmono);font-size:12.5px;line-height:1.8;padding:14px 24px 24px}
  .src::placeholder{color:var(--nt3)}
  .deg{margin:10px 24px 0;display:flex;gap:8px;align-items:flex-start;font-size:11.5px;color:var(--nwarn);background:var(--nbg-raise);border-left:3px solid var(--nwarn);border-radius:var(--nr-md);padding:8px 12px;line-height:1.6;flex-shrink:0}
  .deg svg.ic{width:13px;height:13px;margin-top:2px;flex-shrink:0}
  .deg .rs{color:var(--nt2);word-break:break-all}
  .modeseg{display:inline-flex;gap:2px;background:var(--nbg-raise);border:1px solid var(--nbd-soft);border-radius:20px;padding:2px;flex-shrink:0}
  .modeseg .seg{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:11.5px;padding:3px 13px;border-radius:16px;color:var(--nt2);cursor:pointer;border:0;background:transparent;white-space:nowrap}
  .modeseg .seg:hover:not(.on):not(.dis){color:var(--ntx);background:var(--nbg-hover)}
  .modeseg .seg.on{background:var(--nbg-sel);color:var(--nacc-tx);font-weight:600}
  .modeseg .seg.dis{opacity:.42;cursor:not-allowed}
  .modeseg .seg svg.ic{width:12px;height:12px}
  .ed-meta .kbd{font-family:var(--nmono);font-size:10px;background:var(--nbg);border:1px solid var(--nbd);border-radius:4px;padding:1px 5px;color:var(--nt3);align-self:center}
  .tipwrap{position:relative;display:inline-flex}
  .tip{position:absolute;bottom:calc(100% + 8px);right:-8px;z-index:80;background:var(--npanel);border:1px solid var(--nbd);border-radius:var(--nr-sm);box-shadow:0 8px 24px rgba(0,0,0,.35);color:var(--nwarn);font-size:11px;padding:5px 10px;white-space:nowrap;display:none;pointer-events:none}
  .tipwrap.deg:hover .tip{display:block} /* 仅降级态悬停禁用段时出现 */
  .rich-scroll{flex:1;min-height:0;overflow-y:auto;position:relative;display:flex;flex-direction:column}
  .rtb{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:2px;padding:7px 24px;background:var(--npanel);border-bottom:1px solid var(--nbd-soft);flex-shrink:0}
  .rtb-btn{width:27px;height:26px;display:grid;place-items:center;border-radius:var(--nr-sm);color:var(--nt2);cursor:pointer;border:0;background:transparent;font:inherit;padding:0}
  .rtb-btn:hover{background:var(--nbg-hover);color:var(--ntx)}
  .rtb-btn.on{background:var(--nbg-sel);color:var(--nacc-tx)}
  .rtb-btn svg.ic{width:14px;height:14px}
  .rtb-sep{width:1px;height:16px;background:var(--nbd);margin:0 6px;flex-shrink:0}
  .rtb .sync{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--nt3);white-space:nowrap}
  .rtb .sync .sd{width:6px;height:6px;border-radius:50%;background:var(--nwarn)}
  html[data-theme="dark"] .rtb .sync.ok .sd{background:#56c88f}
  html[data-theme="light"] .rtb .sync.ok .sd{background:#2f9e6e}
  .rich{flex:1;padding:14px 24px 64px;outline:none;font-size:13px;line-height:1.75;min-height:calc(100% - 40px);caret-color:var(--nacc)}
  .rich:empty::before{content:var(--i18n-ed-rich-ph,"正文…（富文本，编辑后失焦自动同步源码）");color:var(--nt3)}
  .rich p{margin:0 0 14px;word-break:break-word}
  .rich h1{font-size:19px;font-weight:700;margin:24px 0 12px;letter-spacing:.3px}
  .rich h2{font-size:16.5px;font-weight:600;margin:20px 0 10px;letter-spacing:.2px}
  .rich h3{font-size:14.5px;font-weight:600;margin:16px 0 8px}
  .rich h1:first-child,.rich h2:first-child,.rich h3:first-child,.rich p:first-child{margin-top:0}
  .rich ul,.rich ol{margin:0 0 14px;padding-left:24px}
  .rich li{margin-bottom:5px;word-break:break-word}
  .rich blockquote{margin:0 0 14px;padding:10px 16px;border-left:3px solid var(--nbd);background:var(--nbg-raise);border-radius:0 var(--nr-sm) var(--nr-sm) 0;color:var(--nt2)}
  .rich blockquote p{margin:0}
  .rich pre{background:var(--nbg-raise);border:1px solid var(--nbd-soft);border-radius:var(--nr-md);padding:14px 16px;margin:0 0 14px;overflow-x:auto;font-family:var(--nmono);font-size:12.5px;line-height:1.65;position:relative;white-space:pre-wrap}
  .rich pre[data-lang]::before{content:attr(data-lang);position:absolute;top:6px;right:10px;font-size:10px;color:var(--nt3);font-family:var(--nmono)}
  .rich pre code{background:none;border:none;padding:0;font-size:inherit}
  .rich code{font-family:var(--nmono);font-size:12px;background:var(--nbg-raise);border:1px solid var(--nbd-soft);border-radius:4px;padding:1px 6px}
  .rich a{color:var(--nacc);text-decoration:none;border-bottom:1px solid transparent}
  .rich a:hover{border-bottom-color:var(--nacc)}
  .rich strong{font-weight:600}
  .rich hr{border:0;border-top:1px solid var(--nbd);margin:20px 0}
  .rich img{max-width:min(460px,100%);border-radius:var(--nr-md);border:1px solid var(--nbd-soft);display:block;margin:4px 0;cursor:default}
  .rich p img{display:inline-block;vertical-align:middle;margin:0}
  .rich img:hover{outline:2px solid var(--nacc);outline-offset:1px}
  .rich-wrap.drop .rich{outline:2px dashed var(--nacc);outline-offset:-6px;border-radius:var(--nr-md)}
  /* ===== L2 GFM 表格只读渲染（与面板 styles.css 同款；原始源码经 data-md-src 逐字回吐，富文本内不编辑） ===== */
  .rich table.dsh-notes-table{border-collapse:collapse;margin:0 0 14px;cursor:not-allowed}
  .rich table.dsh-notes-table th,.rich table.dsh-notes-table td{border:1px solid var(--nbd);padding:5px 12px;font-size:12.5px;line-height:1.6;text-align:left}
  .rich table.dsh-notes-table th{background:var(--nbg-raise);font-weight:600}
  .rich table.dsh-notes-table td{color:var(--nt2)}
  /* 图片插入弹窗（upzone/pv/prog 原型同款，modal 复用现有容器） */
  .upzone{border:1.5px dashed var(--nbd);border-radius:var(--nr-md);padding:13px;text-align:center;color:var(--nt3);font-size:11.5px;line-height:1.7;cursor:pointer}
  .upzone:hover{border-color:var(--nacc);color:var(--nt2)}
  .uppv{display:flex;gap:10px;align-items:center;background:var(--nbg-raise);border:1px solid var(--nbd-soft);border-radius:var(--nr-md);padding:8px 10px;margin-bottom:10px}
  .uppv img{width:72px;height:44px;object-fit:cover;border-radius:4px;flex-shrink:0}
  .uppv .nm{font-size:11.5px;color:var(--ntx);word-break:break-all}
  .uppv .sz{font-size:10px;color:var(--nt3);margin-top:2px}
  .prog{height:4px;background:var(--nbg-raise);border-radius:2px;overflow:hidden;margin-top:12px;display:none}
  .prog.on{display:block}
  .prog i{display:block;height:100%;width:40%;background:var(--nacc);border-radius:2px;animation:imgup-ind 1s ease-in-out infinite alternate}
  @keyframes imgup-ind{from{margin-left:0;width:30%}to{margin-left:70%;width:30%}}
  .ed-foot{padding:8px 24px 12px;display:flex;gap:14px;font-size:10.5px;color:var(--nt3);border-top:1px solid var(--nbd-soft)}
  .ed-foot .saved{margin-left:auto;color:var(--nt2)}
  /* ===== P2 笔记双链：[[..]] 渲染锚 + 行尾双链标记 + 反向链接面板 ===== */
  .rich a.dsh-notes-wikilink{color:var(--nacc);text-decoration:none;border-bottom:1px dashed var(--nacc);cursor:pointer;border-radius:3px;padding:0 1px}
  .rich a.dsh-notes-wikilink:hover{background:var(--nbg-sel)}
  .note-row .wikimark{display:flex;flex-shrink:0;color:var(--nt3);align-items:center}
  .note-row .wikimark svg.ic{width:9px;height:9px}
  /* 曾注入行徽章（injectEver 粘性标记：淡灰时钟，与已注入 bolt 蓝徽章互斥显示） */
  .note-row .injevr{display:flex;flex-shrink:0;color:var(--nt3);align-items:center}
  .backlinks{border-top:1px solid var(--nbd-soft);padding:6px 24px;flex-shrink:0}
  .backlinks .bl-t{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;letter-spacing:.6px;color:var(--nt3);text-transform:uppercase}
  .backlinks .bl-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
  .backlinks .bl-item{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ntx);background:var(--nbg-raise);border:1px solid var(--nbd-soft);border-radius:20px;padding:2px 9px;cursor:pointer}
  .backlinks .bl-item:hover{background:var(--nbg-hover);border-color:var(--nacc)}
  .backlinks .bl-empty{margin-top:4px;font-size:11px;color:var(--nt3)}
  /* ===== 注入范围浮层 ===== */
  .scope-wrap{position:relative}
  .scope-panel{position:absolute;top:calc(100% + 6px);left:0;z-index:60;min-width:210px;max-width:300px;max-height:260px;overflow-y:auto;background:var(--npanel);border:1px solid var(--nbd);border-radius:var(--nr-md);box-shadow:0 10px 32px rgba(0,0,0,.4);padding:6px}
  .scope-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--nt2);padding:5px 8px;border-radius:var(--nr-sm);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .scope-item:hover{background:var(--nbg-hover);color:var(--ntx)}
  .scope-item input{accent-color:var(--nacc)}
  .scope-item.dis{opacity:.5;cursor:default}
  .scope-sep{margin:6px 8px 2px;font-size:10px;color:var(--nt3);letter-spacing:.6px}
  .scope-hint{font-size:10.5px;color:var(--nt3);padding:2px 8px 6px;line-height:1.5;border-bottom:1px solid var(--nbd-soft);margin-bottom:4px}
  .scope-ws{font-size:10.5px;color:var(--nt3);padding:5px 8px 2px}
  /* ===== 派发历史 ===== */
  .disp{margin:0 24px;padding:8px 0 0;font-size:11.5px}
  .disp-t{color:var(--nt3);cursor:pointer;user-select:none}
  .disp-t:hover{color:var(--nt2)}
  .disp-rec{border:1px solid var(--nbd-soft);border-radius:var(--nr-md);padding:7px 10px;margin-top:6px;background:var(--nbg-raise)}
  .disp-rec.done{opacity:.6}
  .disp-rec-top{display:flex;align-items:center;gap:6px;color:var(--ntx)}
  .disp-rec-top .dot{width:6px;height:6px;border-radius:50%;background:var(--nwarn)}
  .disp-rec-m{margin-left:auto;font-size:10.5px;color:var(--nt3)}
  .disp-rec-i{margin-top:4px;color:var(--nt2);font-size:11px;white-space:pre-wrap}
  .disp-done-btn{margin-top:5px;font-size:11px;color:var(--nacc-tx);background:transparent;border:1px solid var(--nbd);border-radius:var(--nr-sm);padding:2px 10px;cursor:pointer}
  .disp-done-btn:hover{border-color:var(--nacc)}
  /* 0.4.4-A（notes-044-dispatch-receipts）：派发历史行尾「执行记录 ↗」按钮（与 done-btn 同族样式，间距分隔） */
  .disp-log-act{margin-top:5px;margin-left:6px;font-size:11px;color:var(--nacc-tx);background:transparent;border:1px solid var(--nbd);border-radius:var(--nr-sm);padding:2px 10px;cursor:pointer}
  .disp-log-act:hover{border-color:var(--nacc)}
  /* ===== P3 派发闭环徽章（详情 meta chips 行）：pending=有待回执（橙色脉冲图标），done=全部已回执（灰） ===== */
  .disp-badge{user-select:none}
  .disp-badge.pending{color:var(--nwarn);border-color:var(--nwarn)}
  .disp-badge.pending .ic{animation:dispPulse 1.6s ease-in-out infinite}
  .disp-badge.done{color:var(--nt3)}
  @keyframes dispPulse{0%,100%{opacity:1}50%{opacity:.35}}
  /* ===== 通用 modal ===== */
  .mask{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.45);display:grid;place-items:center}
  .modal{width:460px;max-width:calc(100vw - 60px);max-height:82vh;overflow-y:auto;background:var(--npanel);border:1px solid var(--nbd);border-radius:var(--nr-lg);box-shadow:0 16px 48px rgba(0,0,0,.5);padding:16px}
  .modal-t{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;margin-bottom:12px}
  .modal-t .sub{font-size:10.5px;color:var(--nt3);font-weight:400}
  .modal-hint{font-size:11.5px;color:var(--nt3);line-height:1.6;margin-bottom:10px}
  .modal-err{font-size:11.5px;color:var(--ndanger);margin-top:10px;line-height:1.5;white-space:pre-wrap}
  .modal-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  .mbtn{font:inherit;font-size:12px;padding:5px 16px;border-radius:var(--nr-md);border:1px solid var(--nbd);background:var(--nbg-raise);color:var(--nt2);cursor:pointer}
  .mbtn:hover{color:var(--ntx);background:var(--nbg-hover)}
  .mbtn.primary{background:var(--nacc);border-color:transparent;color:#fff;font-weight:600}
  .mbtn.primary:hover{opacity:.9}
  .mbtn.primary:disabled,.mbtn.danger:disabled{opacity:.45;cursor:default}
  .mbtn.danger{background:var(--ndanger);border-color:transparent;color:#fff;font-weight:600}
  .minput{width:100%;font:inherit;font-size:12px;color:var(--ntx);background:var(--nbg-raise);border:1px solid var(--nbd-soft);border-radius:var(--nr-md);padding:7px 10px;outline:0}
  .minput:focus{border-color:var(--nacc)}
  textarea.minput{resize:vertical;line-height:1.6}
  /* 设置卡片 */
  .set-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--nbd-soft)}
  .set-row:last-child{border-bottom:0}
  /* 设置卡标题栏动作区（notes-settings-feedback）：✕ 常驻关闭 + dirty 态「保存」（accent 实心主按钮）/「还原」（次按钮）——无改动时禁用灰显 */
  .set-t-acts{margin-left:auto;display:flex;align-items:center;gap:6px}
  .set-t-acts .mbtn{padding:3px 12px;font-size:11px}
  .set-t-acts .mbtn:disabled{opacity:.45;cursor:default}
  .set-t-acts .set-x{padding:3px 6px;display:inline-flex;align-items:center}
  /* ===== 键盘流速查表（cheat sheet，notes-034-f-cheatsheet）：复用 modal 框架，键帽行两栏布局（与原型 notes-ui-v2.html 同款） ===== */
  .cs-list{display:flex;flex-direction:column;gap:2px}
  .cs-row{display:flex;align-items:center;gap:10px;padding:5px 6px;border-radius:var(--nr-sm)}
  .cs-row:hover{background:var(--nbg-hover)}
  .cs-keys{flex-shrink:0;min-width:76px;text-align:right}
  .cs-keys kbd{font-family:var(--nmono);font-size:10.5px;background:var(--nbg-raise);border:1px solid var(--nbd);border-radius:4px;padding:1px 6px;color:var(--ntx);white-space:nowrap}
  .cs-desc{font-size:12px;color:var(--nt2);line-height:1.5}
  /* ===== 注入预览 modal（设置卡片「注入预览」入口）：双 tab + 只读等宽文本 + 底部统计条（与原型 notes-ui-v2.html 同款） ===== */
  .modal.injprev{width:640px}
  .injprev-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .injprev-sess{margin-left:auto;width:auto;max-width:240px}
  .injprev-text{font-family:var(--nmono);font-size:11px;line-height:1.65;background:var(--nbg);border:1px solid var(--nbd-soft);border-radius:var(--nr-md);padding:10px 12px;max-height:48vh;min-height:120px;overflow:auto;white-space:pre-wrap;word-break:break-word;margin:0;color:var(--nt2)}
  .injprev-conv{margin:0 0 8px;font:inherit;white-space:pre-wrap;word-break:break-word;color:var(--nt2)}   /* 0.4.3 验收修复③（notes-043-dir-merge）：单段视图——约定段 pre + 目录段可点行同容器 */
  .injprev-ln{min-height:1em}   /* 0.4.3 验收修复（notes-043-preview-when-edit）：目录段逐行渲染（可点行补充/编辑 whenToUse） */
  .injprev-ln.hit{cursor:pointer}
  .injprev-ln.hit:hover{color:var(--ntx);background:var(--nbg-hover);border-radius:4px}
  .injprev-stats{font-size:10.5px;color:var(--nt3);margin-top:10px;line-height:1.6}
  /* ===== 注入管理面板 modal（设置卡片「注入管理」入口；notes-inject-manager）：统计 chips（点击=过滤）+ 搜索 + 批量条 + 三态 segmented 行（与原型 notes-ui-v2.html 同款） ===== */
  /* 批量条/勾选复用 trash 系列（.trash-all/.selcnt/.trash-check/.trash-act） */
  .modal.injmgr{width:680px}
  .injmgr-bar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .injmgr-chips{display:flex;gap:4px;flex-shrink:0}
  .injmgr-chip{font:inherit;font-size:11px;padding:3px 11px;border-radius:20px;border:1px solid var(--nbd);background:transparent;color:var(--nt2);cursor:pointer;white-space:nowrap}
  .injmgr-chip:hover{color:var(--ntx);background:var(--nbg-hover)}
  .injmgr-chip.on{background:var(--nbg-sel);border-color:transparent;color:var(--nacc-tx);font-weight:600}
  .injmgr-search{flex:1;min-width:0;font:inherit;font-size:11.5px;color:var(--ntx);background:var(--nbg-raise);border:1px solid var(--nbd-soft);border-radius:var(--nr-sm);padding:4px 9px;outline:0}
  .injmgr-search:focus{border-color:var(--nacc)}
  /* 挂载区统计行（0.4.3 验收修复⑥ notes-043-metrics-present）：chips 行下紧凑信号行，点开展开全量分通道统计 */
  .injmgr-mntstats-row{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--nt2);cursor:pointer;padding:2px 8px;border:1px solid var(--nbd-soft);border-radius:20px;background:var(--nbg-raise);margin:0 0 8px}
  .injmgr-mntstats-row:hover{color:var(--ntx);border-color:var(--nacc)}
  .injmgr-mntstats-full{margin:-4px 0 8px;padding:6px 9px;border:1px solid var(--nbd-soft);border-radius:var(--nr-md);font-size:11px;line-height:1.7;word-break:break-all;color:var(--nt2)}
  .injmgr-batch{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:11.5px;color:var(--nt2)}
  .injmgr-list{border:1px solid var(--nbd-soft);border-radius:var(--nr-md);margin-bottom:10px;max-height:46vh;overflow-y:auto}
  .injmgr-row{display:flex;align-items:center;gap:7px;padding:6px 9px;font-size:12px;border-bottom:1px solid var(--nbd-soft)}
  .injmgr-row:last-child{border-bottom:none}
  .injmgr-ti{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-weight:600}
  .injmgr-scope{font-size:10.5px;color:var(--nt3);flex-shrink:0;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .injmgr-sens{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--nwarn);flex-shrink:0}
  .injmgr-ever{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--nt3);flex-shrink:0}
  .injmgr-seg{display:inline-flex;align-items:center;gap:2px;padding:2px 3px;border:1px solid var(--nbd);border-radius:14px;flex-shrink:0;color:var(--nt3)}
  .injmgr-opt{padding:1px 8px;border-radius:11px;color:var(--nt3);cursor:pointer;user-select:none;font-size:11px}
  .injmgr-opt:hover{color:var(--ntx);background:var(--nbg-hover)}
  .injmgr-opt.on{background:var(--nbg-sel);color:var(--nacc-tx);font-weight:600}
  .injmgr-opt.dis{opacity:.38;cursor:default}
  .injmgr-opt.dis:hover{background:transparent;color:var(--nt3)}
  /* 0.4.3⑦ 注入硬关 UI 化：log 行不渲染勾选框/注入开关——占位槽保行对齐 + 静态「不参与注入」标注 */
  .injmgr-checkslot{display:inline-block;width:13px;flex-shrink:0}
  .injmgr-lognote{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--nt3);flex-shrink:0;padding:2px 3px}
  /* ===== 挂载弹层 modal（0.4.3⑤ notes-043-index：资料开注入 → 手写 whenToUse 落注入索引 §1 行；mask/modal 复用框架类） ===== */
  .inj-mount-body{display:flex;flex-direction:column;gap:5px;margin:10px 0 4px}
  .inj-mount-label{font-size:11px;color:var(--nt2)}
  .inj-mount-when{width:100%;box-sizing:border-box;font:inherit;font-size:12px;line-height:1.6;color:var(--ntx);background:var(--nbg-raise);border:1px solid var(--nbd-soft);border-radius:var(--nr-sm);padding:7px 9px;outline:0;resize:vertical;min-height:64px}
  .inj-mount-when:focus{border-color:var(--nacc)}
  /* ===== 历史版本面板 modal（详情 meta 行「历史」入口；notes-history-ui）：左列版本列表（时间+大小，倒序）+ 右侧只读预览（renderMarkdown 内核渲染；与原型 notes-ui-v2.html 同款） ===== */
  .modal.hist{width:720px}
  .hist-body{display:flex;gap:10px;min-height:190px;margin-bottom:4px}
  .hist-list{width:184px;flex-shrink:0;max-height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
  .hist-item{padding:6px 9px;border-radius:var(--nr-md);cursor:pointer;border:1px solid transparent;flex-shrink:0}
  .hist-item:hover{background:var(--nbg-hover)}
  .hist-item.on{background:var(--nbg-sel);border-color:var(--nacc)}
  .hist-item-t{font-size:11.5px;color:var(--ntx);font-family:var(--nmono)}
  .hist-item-b{font-size:10px;color:var(--nt3);margin-top:2px}
  .hist-view{flex:1;min-width:0}
  .hist-preview{font-size:12px;line-height:1.7;background:var(--nbg);border:1px solid var(--nbd-soft);border-radius:var(--nr-md);padding:12px 14px;max-height:52vh;min-height:180px;overflow:auto;box-sizing:border-box}
  .set-label{flex:1;font-size:12.5px}
  .set-label .s{display:block;font-size:10.5px;color:var(--nt3);margin-top:2px;line-height:1.5}
  .set-ctrl{display:flex;align-items:center;gap:6px}
  .set-ctrl select{max-width:190px}
  /* LLM 用量区（设置卡片「LLM 用量」行）：数值两行竖排 */
  .set-ctrl.usage{flex-direction:column;align-items:flex-end;gap:2px}
  .usage-line{font-size:11.5px;color:var(--ntx);line-height:1.5}
  .set-check{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--nt2);cursor:pointer}
  .set-check input{accent-color:var(--nacc)}
  /* 派发对话框 */
  .disp-todo{border:1px solid var(--nbd-soft);border-radius:var(--nr-md);background:var(--nbg-raise);padding:8px 10px;margin-bottom:10px}
  .disp-todo-t{font-size:12.5px;font-weight:600}
  .disp-todo-b{font-size:11px;color:var(--nt3);margin-top:3px;max-height:48px;overflow:hidden;white-space:pre-wrap}
  .disp-ws{font-size:10.5px;color:var(--nt3);letter-spacing:.6px;margin:10px 0 3px}
  .disp-sess{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--nt2);padding:6px 8px;border-radius:var(--nr-sm);cursor:pointer}
  .disp-sess:hover{background:var(--nbg-hover);color:var(--ntx)}
  .disp-sess.on{background:var(--nbg-sel);color:var(--nacc-tx)}
  .disp-sess.dis{opacity:.5;cursor:default}
  .disp-sess .live{width:6px;height:6px;border-radius:50%;background:#56c88f;flex-shrink:0}
  .disp-sess .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* ===== 定时派发·设置交互（notes-034-sched-ui）：派发弹窗调度区 + 注入管理「调度任务」区 ===== */
  .sched-box{border:1px solid var(--nbd-soft);border-radius:var(--nr-md);padding:7px 10px;margin-bottom:10px;font-size:12px;color:var(--nt2)}
  .sched-opt{display:inline-flex;align-items:center;gap:4px;margin-right:14px;cursor:pointer;user-select:none}
  .sched-opt input{accent-color:var(--nacc)}
  .sched-form{margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sched-sel{width:auto;padding:4px 8px;font-size:11.5px}
  .sched-n{width:64px;padding:4px 8px;font-size:11.5px}
  .sched-at{width:auto;padding:4px 8px;font-size:11.5px}
  .sched-next{flex-basis:100%;font-size:10.5px;color:var(--nt3);margin-top:2px}
  .sched-next.warn{color:var(--ndanger)}
  .sched-sec{border:1px solid var(--nbd-soft);border-radius:var(--nr-md);margin-bottom:10px}
  .sched-sec-t{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--nt2);padding:7px 9px;border-bottom:1px solid var(--nbd-soft)}
  .sched-sec-t .sub{font-weight:400;color:var(--nt3);font-size:10px;margin-left:4px}
  .sched-sec .modal-hint{padding:7px 9px;margin-bottom:2px}
  .sched-row{display:flex;align-items:center;gap:8px;padding:6px 9px;font-size:11.5px;border-bottom:1px solid var(--nbd-soft)}
  .sched-row:last-child{border-bottom:none}
  .sched-row.paused{opacity:.6}
  .sched-row-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .sched-freq{color:var(--nacc-tx);flex-shrink:0;font-size:10.5px}
  .sched-target{color:var(--nt3);flex-shrink:0;font-size:10.5px;font-family:var(--nmono)}
  .sched-nf{color:var(--nt2);flex-shrink:0;font-size:10.5px;white-space:nowrap}
  .sched-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--nt3);border:1px solid var(--nbd);border-radius:10px;padding:0 7px;flex-shrink:0;white-space:nowrap}
  .sched-badge.ok{color:#56c88f;border-color:transparent;background:rgba(86,200,143,.12)}
  .sched-badge.err{color:var(--ndanger);border-color:transparent;background:rgba(229,115,79,.12);max-width:170px;overflow:hidden;text-overflow:ellipsis}
  .sched-badge.off{color:var(--nwarn);border-color:transparent;background:rgba(229,181,103,.12)}
  .sched-acts{display:inline-flex;gap:4px;flex-shrink:0}
  .sched-act{padding:1px 9px;font-size:10.5px}
  /* 详情派发计划块（notes-034-sched-detail）：meta 区尾部全宽行（flex-basis:100% 自成一行）+ 关联调度清单行 */
  .sched-plan{flex-basis:100%;border:1px solid var(--nbd-soft);border-radius:var(--nr-md);padding:2px 0;font-size:11.5px;margin-top:2px}
  .sched-plan-row{display:flex;align-items:center;gap:8px;padding:4px 9px;border-bottom:1px solid var(--nbd-soft)}
  .sched-plan-row:last-child{border-bottom:none}
  .sched-plan-row.paused{opacity:.6}
  .sched-plan-t{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--nt3);flex-shrink:0}
  .sched-peer{cursor:pointer}
  .sched-peer:hover{background:var(--nbg-hover)}
  .sched-peer-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ntx)}
  /* 导入预览 */
  .imp-sum{display:flex;gap:12px;font-size:11.5px;color:var(--nt2);margin:10px 0 6px;flex-wrap:wrap}
  .imp-sum b{color:var(--ntx)}
  .imp-sum .added b{color:#56c88f} .imp-sum .diff b{color:var(--nwarn)}
  .imp-warn{font-size:11px;color:var(--nwarn);margin-bottom:6px}
  .imp-list{max-height:180px;overflow-y:auto;border:1px solid var(--nbd-soft);border-radius:var(--nr-md);padding:4px}
  .imp-row{display:flex;align-items:center;gap:7px;font-size:11.5px;padding:3.5px 6px;color:var(--nt2)}
  .imp-badge{font-size:10px;border-radius:4px;padding:0 6px;flex-shrink:0;border:1px solid var(--nbd)}
  .imp-badge.added{color:#56c88f} .imp-badge.diff{color:var(--nwarn)} .imp-badge.same{color:var(--nt3)}
  .imp-row .ti{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .imp-deltag{font-size:10px;color:var(--ndanger)}
  /* ===== toast ===== */
  .toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(8px);background:var(--npanel);border:1px solid var(--nbd);box-shadow:0 6px 24px rgba(0,0,0,.35);color:var(--ntx);font-size:12px;padding:8px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:all .2s;z-index:200;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .toast.show{opacity:1;pointer-events:auto}
  .toast a{color:var(--nacc-tx);margin-left:8px;cursor:pointer}
  .hintbar{padding:6px 14px;background:var(--npanel);border-top:1px solid var(--nbd);font-size:11px;color:var(--nt3);display:flex;gap:16px}
  /* ===== 文件夹右键菜单 ===== */
  .ctxmenu{position:fixed;z-index:150;min-width:150px;background:var(--npanel);border:1px solid var(--nbd);border-radius:var(--nr-md);box-shadow:0 10px 32px rgba(0,0,0,.4);padding:4px}
  .ctxmenu .mi{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--nt2);padding:6px 10px;border-radius:var(--nr-sm);cursor:pointer}
  .ctxmenu .mi:hover{background:var(--nbg-hover);color:var(--ntx)}
  .ctxmenu .mi.danger:hover{color:var(--ndanger)}
  .ctxmenu .mi svg.ic{width:12px;height:12px}
  /* ===== 快速记录卡片（v2） ===== */
  .cap{position:fixed;z-index:99;width:300px;background:var(--npanel);border:1px solid var(--nbd);border-radius:var(--nr-lg);box-shadow:0 10px 32px rgba(0,0,0,.4);overflow:hidden;animation:capin .14s ease-out}
  @keyframes capin{from{opacity:0;transform:translateY(5px) scale(.98)}to{opacity:1;transform:none}}
  .cap-h{display:flex;align-items:center;gap:7px;padding:9px 12px 0;font-size:10.5px;color:var(--nt3)}
  .cap-h .src{display:flex;align-items:center;gap:4px}
  .cap-h .auto{margin-left:auto;display:flex;align-items:center;gap:4px;background:var(--nbg-sel);color:var(--nacc-tx);border-radius:20px;padding:1px 8px;font-size:10px}
  .cap-h .auto .dot{width:6px;height:6px;border-radius:50%;background:var(--kind-quote)}
  .cap-pv{margin:8px 12px 0;padding:8px 10px;background:var(--nbg-raise);border:1px solid var(--nbd-soft);border-radius:var(--nr-md);font-size:11.5px;line-height:1.5;color:var(--nt2);max-height:64px;overflow:hidden;position:relative;white-space:pre-wrap}
  .cap-pv::after{content:"";position:absolute;bottom:0;left:0;right:0;height:14px;background:linear-gradient(transparent,var(--nbg-raise))}
  .cap-in{display:flex;align-items:center;gap:7px;margin:8px 12px 0;background:var(--nbg-raise);border:1px solid var(--nbd-soft);border-radius:var(--nr-md);padding:6px 10px}
  .cap-in:focus-within{border-color:var(--nacc)}
  .cap-in input{flex:1;border:0;outline:0;background:transparent;color:var(--ntx);font:inherit;font-size:12px}
  .cap-in input::placeholder{color:var(--nt3)}
  .cap-in .kbd{font-family:var(--nmono);font-size:9.5px;color:var(--nt3);background:var(--nbg);border:1px solid var(--nbd);border-radius:4px;padding:1px 5px;flex-shrink:0}
  .cap-acts{display:flex;gap:6px;padding:9px 12px 11px}
  .cbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;font-size:11.5px;padding:6px 0;border-radius:var(--nr-md);border:1px solid var(--nbd);background:var(--nbg-raise);color:var(--nt2);cursor:pointer}
  .cbtn:hover{color:var(--ntx);background:var(--nbg-hover)}
  .cbtn.primary{background:var(--nacc);border-color:transparent;color:#fff;font-weight:600}
  .cbtn.primary:hover{opacity:.9}
  .cbtn svg.ic{width:12px;height:12px}
</style>

<script>
/* ================= 数据层：/dsh-notes RPC（与 lib/client.js 同模式） ================= */
function rpc(method, args) {
  return fetch('/dsh-notes', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ method: method, args: args || {} })
  }).then(function (r) { return r.json() })
}

/* ================= 常量与状态 ================= */
var KIND = { note: '笔记', decision: '决策', todo: '待办', link: '链接', quote: '引用', log: '日志', sys: '机器' };   /* 0.4.3⑩ +sys「机器」（筛选中心「机器」档标签/持久化校验用；编辑器 kind 下拉不收 sys——机器托管 kind 人工不转，见 editor-meta.js） */
var KCOLOR = { note: 'var(--kind-note)', decision: 'var(--kind-decision)', todo: 'var(--kind-todo)', link: 'var(--kind-link)', quote: 'var(--kind-quote)', log: 'var(--kind-log)', sys: 'var(--kind-sys)' };
/* 二期：kind 模板骨架（新建预填）——与 host-impl.js / index.mjs / client-impl.js / 原型同一份（check.js 断言一致）；
   note 为自由格式（空骨架）；机器/运维信息类由 ✨整理按内容套用机器模板（建时无法预判内容，不进 KIND_TEMPLATES） */
var KIND_TEMPLATES = {
  note: '',
  decision: '## 背景\n\n（问题与上下文）\n\n## 结论\n\n（最终选择）\n\n## 理由\n\n（权衡与依据）\n',
  todo: '- [ ] （待办事项）\n',
  link: '## 链接\n\n（URL）\n\n## 说明\n\n（用途与要点）\n',
  quote: '> （引用原文）\n\n—— （出处）\n',
  /* 工作记忆 v0 工作日志模板（design/agent-memory-v0.md §4.2 四节结构；同日追加尾部加「## HH:mm 续」小节） */
  log: '## 做了什么\n\n（本会话完成的任务/阶段，一句话一条）\n\n## 改动\n\n（改动的文件/配置/数据，路径 + 一句话）\n\n## 遗留与后续\n\n（未完成事项、已知风险、下次接续的入口）\n\n## 相关笔记\n\n（[[n-xxxxxxxx]] 双链引用本库相关笔记；无则空）\n'
};
var STATUS_LABEL = { active: '进行中', pinned: '置顶', resolved: '已解决', superseded: '已取代' };
var notes = [];              // slim 列表缓存（常驻内存；写操作后静默回填）
var folders = [];            // 虚拟文件夹清单 [{id,name,order,count}]
var view = { type: 'all', id: '' };   // all | topic（0.4.3⑦：「文件视图」（文件夹视图）模式整体拆除）
/* ===== 筛选中心状态（design/notes-filter-center.html 落地）：组内 OR / 跨组 AND；与主题视图/搜索 AND 叠加；localStorage 持久化 ===== */
var _fs = loadFilters();               // 持久化恢复（dsh-notes-app-filters）
var filters = _fs.filters;             // {pinned, injected, injectEver, sensitive, kinds[]}（injectEver 由 notes-inject-filter 提供，feature-detect）
var sortBy = _fs.sortBy;               // time=按更新（缺省，与 host _list 一致）| use=按被引用次数降序 | rel=相关度（搜索时：标题>标签>正文，同级 updatedAt 降序）
var filterOpen = false;      // 筛选 popover 浮层开关
var sortOpen = false;        // 排序菜单浮层开关
/* 筛选中心条件模型（四端同构：client-impl.js / 本页 / 原型 / check.js 断言一致） */
var FILTER_STATUS = [
  { id: 'pinned', label: '置顶', icon: 'i-pin', pred: function (n) { return n.status === 'pinned' } },
  { id: 'injected', label: '已注入', icon: 'i-bolt', pred: function (n) { return n.inject === true } },
  { id: 'injectEver', label: '曾注入', icon: 'i-clock', pred: function (n) { return n.injectEver === true } },   /* 含已注入；字段由 notes-inject-filter 提供 */
  { id: 'sensitive', label: '敏感', icon: 'i-lock', pred: function (n) { return n.sensitive === true } }
];
var FILTER_KINDS = ['note', 'decision', 'todo', 'link', 'quote', 'log', 'sys'];   /* 类型组含 log（0.4.3⑦ 日志同权：勾选「日志」= 只看日志，与普通 kind 过滤同语义，不再是隐身专入口）+ sys（0.4.3⑩「机器」档：勾选=全库 sys 机器笔记（含「记忆档案」夹内档案）经 host kind 通道直达，面板翻账本入口） */
var FILTER_SORTS = [
  { id: 'time', label: '时间', desc: '置顶优先 · 更新降序（默认）' },
  { id: 'use', label: '引用', desc: '被引用次数降序' },
  { id: 'rel', label: '相关度', desc: '搜索打分（搜索时生效）' }
];
/* ===== i18n 覆盖卡F（notes-042-i18n-cov-f）：共享常量表条件映射——KIND/STATUS_LABEL/FILTER_STATUS/FILTER_SORTS 中文字面量
   保留作四端同构锚（check 30/34/39 锁定原文 + 原型不双语红线），渲染一律经下列 helper 走 t() 字典（setLang 全量 render 即生效）；
   未知值回退 ''（调用方 || 兜底），永不裸 key ===== */
function kindLabel(k) { return KIND[k] ? t('meta.kind' + k.charAt(0).toUpperCase() + k.slice(1)) : '' }
function statusLabel(s) { if (s === 'pinned') return t('tree.pinned'); return STATUS_LABEL[s] ? t('meta.status' + s.charAt(0).toUpperCase() + s.slice(1)) : '' }
function filterStatusLabel(id) { return id === 'pinned' ? t('tree.pinned') : id === 'injected' ? t('filter.stInjected') : id === 'injectEver' ? t('meta.injectEver') : id === 'sensitive' ? t('meta.sens') : id }
function sortLabelOf(id) { return t('sort.' + (id === 'use' || id === 'rel' ? id : 'time')) }
function sortDescOf(id) { return t('sort.' + (id === 'use' || id === 'rel' ? id : 'time') + 'Desc') }
function loadFilters() {
  var F = { pinned: false, injected: false, injectEver: false, sensitive: false, kinds: [] };
  try {
    var v = localStorage.getItem('dsh-notes-app-filters');
    if (!v) return { filters: F, sortBy: 'time' };
    var s = JSON.parse(v) || {};
    if (s.filters) {
      ['pinned', 'injected', 'injectEver', 'sensitive'].forEach(function (k) { F[k] = s.filters[k] === true });
      if (Array.isArray(s.filters.kinds)) F.kinds = s.filters.kinds.filter(function (k) { return !!KIND[k] });
    }
    return { filters: F, sortBy: (s.sortBy === 'use' || s.sortBy === 'rel') ? s.sortBy : 'time' };
  } catch (e) { return { filters: F, sortBy: 'time' } }
}
function saveFilters() { try { localStorage.setItem('dsh-notes-app-filters', JSON.stringify({ filters: filters, sortBy: sortBy })) } catch (e) {} }
/* ===== 0.4.4-D hidden 隐藏属性（notes-044-hidden-attr）：显隐开关——开=hidden 项半透明渲染（hid 遮罩样式），关=树/列表滤除；
   纯 UI 遮罩（host _list/_search 零改动，agent 面/读写面天然完整）；localStorage 独立键持久（dsh-notes-app-show-hidden）；
   与筛选中心条件正交：不计 filtersActiveCount、清空筛选不重置 ===== */
var showHidden = loadShowHidden();
function loadShowHidden() { try { return localStorage.getItem('dsh-notes-app-show-hidden') === '1' } catch (e) { return false } }
function saveShowHidden() { try { localStorage.setItem('dsh-notes-app-show-hidden', showHidden ? '1' : '0') } catch (e) {} }
function filtersActiveCount() { var n = filters.kinds.length; FILTER_STATUS.forEach(function (s) { if (filters[s.id]) n++ }); return n }
/* 曾注入条件 feature-detect：列表 slim 含 injectEver 字段才显示该选项（host 未提供时隐藏；存量激活条件仍渲染 chip 可 × 移除） */
function hasInjectEver() { return notes.some(function (n) { return n.injectEver !== undefined }) }
/* 筛选谓词（纯函数，check.js 提取做语义回归）：状态组组内 OR、类型组组内 OR、跨组 AND */
function matchFilters(n, F) {
  var st = [];
  if (F.pinned) st.push(n.status === 'pinned');
  if (F.injected) st.push(n.inject === true);
  if (F.injectEver) st.push(n.injectEver === true);
  if (F.sensitive) st.push(n.sensitive === true);
  if (st.length && st.indexOf(true) < 0) return false;
  if (F.kinds.length && F.kinds.indexOf(n.kind || 'note') < 0) return false;
  return true;
}
function clearFilters() { filters = { pinned: false, injected: false, injectEver: false, sensitive: false, kinds: [] }; saveFilters() }
function sortLabel() { return sortLabelOf(sortBy) }   /* i18n 覆盖卡F：排序档标签走 t() 字典（sort.* 条件映射），原 FILTER_SORTS[i].label 字面量仅作锚 */
var searchText = '', searchIds = null; // searchIds=null=仅本地过滤；数组=host 全文命中 ∪ 本地命中
var searchMeta = {};         // host notes-search 返回的命中字段（noteId → ['title'|'tags'|'body']），相关度排序数据源
var searchErrNotified = false;   /* 在线检索失败 toast 去重闸：同一轮故障只提示一次（doSearch 防抖逐键触发，防刷屏），成功即复位 */
var selId = null, edNote = null;       // edNote = 当前选中笔记完整体（含 body）
/* 新建草稿态（notes-034-batch3）：点 + 先开本地草稿（draftNote 非 null，selId 保持 null 不占用任何真实 id），
   首次有效编辑（标题/正文 input 等非空内容）才 notes-create 落库；放弃（切走且零内容）不产生空 Untitled。
   draftCreating = 落库在途闸（在途期间 doSave 只重排防抖，防并发双建） */
var draftNote = null, draftCreating = false;
var focusId = null;            // 键盘导航焦点行（j/k/↑↓ 移动高亮 .focused，Enter 打开；selectNote 同步聚焦）
var edLoading = false;                 /* 正文异步加载中（notes-get 在途）：AI 整理等入口的轻量互斥指示 */
/* R-1 安全态双字段（P0 数据丢失防护，check 节 46 看守）：
   edBodyLoaded = 正文提交闸——仅 notes-get 成功返回当前选中笔记后置 true，doSave 只在此刻携带 body（再也不以「加载中」负向闸判断）；
   edBodyErr = 加载失败安全态——非空时编辑器锁定（标题/正文只读）+ doSave 整体暂停 + 显示重试横幅，绝不以空 body 为基底提交 */
var edBodyLoaded = false, edBodyErr = '';
var dragId = null, dragFolderId = null, saveTimer = null, searchTimer = null;   /* dragFolderId = 文件夹换父拖拽源（与笔记拖拽互斥） */
/* ===== 双模式编辑器 v3 状态（原型 design/notes-editor-v3.html）===== */
var edMode = 'source';                 // 'source' 源码 | 'rich' 富文本（受限 WYSIWYG）；Ctrl+/ 或 meta 行两段开关切换
var richDirty = false;                 // 富文本编辑中（未序列化回源码）
var composing = false;                 // IME 组合输入中（期间不序列化）
var savedRange = null;                 // 富文本选区缓存（工具栏/弹窗操作后恢复）
var degraded = { ok: true, reasons: [] };  // 白名单降级分析（analyzeMarkdown 内核）
var richSyncTimer = null, degTimer = null;
var imgDraft = null, imgUploading = false; // 图片插入弹窗草稿 + 上传中标记（三入口共用：粘贴/拖拽/工具栏按钮）
var sessList = [], sessPending = [];   // 注入范围浮层会话源（notes-sessions）
var foldOpen = loadFoldOpen();         // 文件夹折叠态（localStorage；缺省全展开）
var sysKids = {};                      // 0.4.4-C：文件夹显式展开按需补拉的 sys 子行缓存（fid → { stamp, rows }；stamp=取数时 notes 缓存身份，刷新防陈旧）
var sysKidsInflight = {};              // 0.4.4-C：补拉在途去重闸（fid → true；快速连点/刷新重入不并发重复请求）
var topicOpen = {};                    // 主题过滤行原地展开态（点行主体=展开/收起子列表；session 内有效，不持久化）
var topicSecOpen = false;              // 主题过滤区整体折叠态（缺省折叠：常态只显示「主题 (N)」一行，点分组头展开；session 内记忆，不持久化）

      /* 清洗陈旧折叠态：剔除已删除文件夹的 id 残留（folders 异步到达后执行；foldOpen 语义=仅记折叠 id，残留虽不影响渲染但会持续累积） */
      var changed = false;

}
// 注入范围浮层会话源：titlesPending 时 1.5s 重拉直到补齐（0.1.7 首屏提速契约）

/* ================= 视图求值：主题 ∩ 筛选中心（状态组/类型组，组内 OR 跨组 AND）∩ 搜索 ================= */
/* 0.4.3⑦：「文件视图」（文件夹视图）模式整体拆除——view 取值收窄为 all | topic（树展开即文件夹浏览） */
function matches(n) {
  if (view.type === 'topic') { if ((n.topic || '') !== view.id) return false }
  /* 0.4.4-D hidden 纯 UI 遮罩：显隐开关关 → hidden 笔记 + hidden 夹链内笔记滤除（OS 语义：父夹隐藏即子项不可见；
     note 级/folder 级独立判定；与筛选条件正交——不计 filtersActiveCount）；host 零改动；跳转/open-by-id 不经本函数天然常显 */
  if (!showHidden && (n.hidden === true || (n.folder && folderHidden(n.folder)))) return false;
  /* 日志同权（0.4.3⑦）：无隐身渲染守卫——日志与普通笔记同一过滤管线（类型组勾选「日志」= 只看日志，matchFilters 同语义） */
  if (!matchFilters(n, filters)) return false;
  if (searchText) {
    var q = searchText.toLowerCase();
    var local = ((n.title || '') + ' ' + (n.preview || '') + ' ' + (n.topic || '') + ' ' + (n.tags || []).join(' ') + ' ' + fname(n.folder)).toLowerCase().indexOf(q) >= 0;
    var remote = searchIds ? searchIds.indexOf(n.id) >= 0 : false;
    if (!local && !remote) return false;
  }
  return true;
}

/* ================= 相关度档位（搜索体验升级）：标题命中(3) > 标签命中(2) > 正文命中(1) > 其他(0，如仅 topic 命中)；同级 updatedAt 降序（比较在 renderTree） ================= */
function relRank(n, q) {
  var m = searchMeta[n.id];   /* host notes-search 返回的 matches 命中字段（全文口径）优先；无则按本地字段估算（preview 仅前 200 字，正文命中可能低估） */
  if (m && m.length) { if (m.indexOf('title') >= 0) return 3; if (m.indexOf('tags') >= 0) return 2; if (m.indexOf('body') >= 0) return 1; return 0 }
  if ((n.title || '').toLowerCase().indexOf(q) >= 0) return 3;
  if ((n.tags || []).join(' ').toLowerCase().indexOf(q) >= 0) return 2;
  if ((n.preview || '').toLowerCase().indexOf(q) >= 0) return 1;
  return 0;
}

/* ================= 筛选中心（design/notes-filter-center.html）：筛选按钮(N) + 激活 chips + 独立排序控件 + popover 分组面板 ================= */

/* ================= 侧栏树 ================= */
/* 日志同权（0.4.3 验收修复⑦，用户裁决推翻 R-6 UI 隐身）：日志随 notes 主缓存直达——

    /* 曾注入徽章（injectEver 粘性标记：历史上开启过注入、现已关闭；已注入由 bolt 表达不重复显示；不满足不渲染） */
    + (!n.inject && n.injectEver === true ? '<span class="injevr" title="' + t('tree.injectEverTip') + '">' + icon('i-clock', 9) + '</span>' : '')
    /* 使用遥测（P2）：被引用徽章（0 次不显示） */
    + ((n.useCount || 0) > 0 ? '<span class="use" title="' + esc(t('tree.useCountTip', { n: n.useCount })) + '">' + icon('i-quote', 9) + n.useCount + '</span>' : '')
    /* 双链标记（P2）：正文含 [[..]] 时行尾显示链接图标（缓存正文优先，preview 兜底） */
    + (hasWikiLinks(n) ? '<span class="wikimark" title="' + t('tree.wikiTip') + '">' + icon('i-link', 9) + '</span>' : '')
    /* 0.4.4-C：sys 行「机器」chip（文件夹显式展开/机器档可见的机器托管笔记可辨识；复用 fbadge 徽章样式 + meta.kindSys 字典键） */

/* ===== 0.4.4-C（notes-044-folder-explicit-view）：文件夹显式展开放行 sys（与 client popovers/folder-menu.js 同构）=====
   默认列表/搜索降噪（0.4.3⑨）不含 sys——「文件夹展开」是唯一显式放行入口（OS 文件管理逻辑：降噪不阻拦查看）：
   按需 notes-list {folder:id} 定向补拉该夹**直挂** sys 行（host _list 显式 folder 入口 = ⑨ 保留通道；host folder 过滤为
   递归子树口径，取回后按直挂过滤，子孙夹 sys 各夹自负）存 sysKids[fid] = { stamp, rows }；非 sys 行忽略（已在主缓存）。
   惰性红线：仅 折叠→展开 / 列表刷新后复核 触发，且「子树徽标计数(含 sys，0.4.3⑩ folders-count-sys) − 缓存可见数 > 0」
   才发请求——普通夹/折叠夹恒零请求（69 节② 展开零 RPC 口径对普通夹保持）；折叠不清缓存（stamp 新鲜则再展开零请求）；
   列表刷新后陈旧条目由 refreshSysKids 剔除/重拉覆盖（防陈旧）。 */
function folderSysHidden(fid) {
  var f = null
  folders.forEach(function (x) { if (x.id === fid) f = x })
  if (!f) return 0
  var sub = folderSubtree(fid)
  var visible = 0
  notes.forEach(function (n) { if (sub[n.folder || '']) visible++ })
  return (f.count || 0) - visible
}
function ensureSysKids(fid) {
  if (!fid) return
  /* kind 单档口径门（0.4.3⑩）：恰选 1 个非 sys kind 时缓存 = host kind 通道子集，与 count 不可比——跳过
     （「机器」档（sys）缓存已含全库 sys 无需补拉；其余单 kind 档下 sys 行本就不该混入） */
  if (filters.kinds.length === 1 && filters.kinds[0] !== 'sys') return
  var ent = sysKids[fid]
  if (ent && ent.stamp === notes) return   /* 新鲜缓存：同批数据再展开零请求 */
  if (sysKidsInflight[fid]) return
  if (folderSysHidden(fid) <= 0) return   /* 无隐藏 sys：普通夹零请求 */
  sysKidsInflight[fid] = true
  var stamp = notes   /* 本批取数的数据身份；响应落地时 notes 已换代则条目即陈旧，refreshSysKids 自重拉覆盖 */
  rpc('notes-list', { folder: fid }).then(function (res) {
    delete sysKidsInflight[fid]
    if (res && res.error) return   /* 失败静默降级：sys 行不显示，下次复核重试 */
    var rows = ((res && res.notes) || []).filter(function (n) { return (n.kind || 'note') === 'sys' && (n.folder || '') === fid })
    sysKids[fid] = { stamp: stamp, rows: rows }
    renderTree()
  }, function () { delete sysKidsInflight[fid] })
}
/* 列表刷新后复核（loadNotes 链路收尾调用）：剔除「文件夹已删 / 折叠且陈旧」条目；展开中的夹重拉覆盖（旧行保留到新行落地，不闪断） */
function refreshSysKids() {
  var fid
  for (fid in sysKids) {
    var exists = false
    folders.forEach(function (x) { if (x.id === fid) exists = true })
    if (!exists || (foldOpen[fid] === false && sysKids[fid].stamp !== notes)) delete sysKids[fid]
  }
  folders.forEach(function (f) { if (foldOpen[f.id] !== false) ensureSysKids(f.id) })
}
/* 嵌套文件夹递归渲染（notes-nested-folder-ui）：depth-first——文件夹行 → 展开时 [子文件夹递归 → 直挂笔记] 包一层 .nested 缩进容器；
   同级同字体/行首槽位对齐沿用排版体系；过滤命中与展开语义按子树（子树含命中 → 自动展开 + 计数=子树命中数，与 host f.count 子树口径一致；
   纯渲染态不写回 foldOpen——清除过滤即恢复手动折叠态）；文件夹行 draggable = 拖拽换父（事件委托见 dragstart/drop） */
function folderNodeHtml(f, vis, filtering) {
  /* 0.4.4-D：hidden 文件夹在显隐开关关时整节点滤除（行 + .nested 子树容器随父夹消失，OS 语义；子文件夹递归与本夹笔记行自然不渲染） */
  if (!showHidden && f.hidden === true) return '';
  var h = '';
  var sub = folderSubtree(f.id);
  var kids = vis.filter(function (n) { return (n.folder || '') === f.id });
  /* 0.4.4-C：合并按需补拉的 sys 子行（置尾从简——sys 行 host 序与主缓存排序口径分离，混排易误导，注释即取舍）；
     过滤/搜索激活时不混入（⑨ 默认列表/搜索降噪零放松：sys 仅「文件夹展开」显式入口放行）；id 去重防御陈旧窗口；
     0.4.4-D：同层叠加 hidden 谓词——显隐开关关时 hidden 档案行不混入（开=带 hid 遮罩样式渲染）；与 C 卡合并零互扰 */
  if (!filtering && sysKids[f.id]) kids = kids.concat(sysKids[f.id].rows.filter(function (n) { return !kids.some(function (x) { return x.id === n.id }) && (showHidden || n.hidden !== true) }));
  var subHits = filtering ? vis.filter(function (n) { return sub[n.folder || ''] }).length : 0;
  var open = (foldOpen[f.id] !== false) || (filtering && subHits > 0);
  /* 行点击（含名称/图标/caret）= 纯展开/折叠（经典树语义，唯一职责——notes-041b 用户裁决去重）；
     0.4.3⑦：「文件视图」模式拆除——行尾 vfilter 漏斗进视图图标已移除，树展开即文件夹浏览 */
  h += '<div class="row head' + (f.hidden === true ? ' hid' : '') + '" data-fold="' + f.id + '" data-drop="1" draggable="true">'
    + '<span class="caret' + (open ? ' open' : '') + '" title="' + t('tree.toggleTip') + '">' + icon('i-chev') + '</span>'
    + '<span class="ic-slot">' + icon('i-folder', 13) + '</span>'
    + '<span class="nm">' + esc(f.name) + '</span><span class="n">' + (filtering ? subHits : (f.count != null ? f.count : kids.length)) + '</span></div>';
  if (!open) return h;

  if (!subFolders.length && !kids.length) return h;
  h += '<div class="nested">';
  subFolders.forEach(function (cf) { h += folderNodeHtml(cf, vis, filtering) });
  kids.forEach(function (n) { h += noteRow(n, true) });

  return h;
}
function renderTree() {
  renderChrome();   /* 覆盖卡A（notes-042-i18n-cov-a）：壳静态串随树渲染收敛刷新（setLang → render() 路径）；函数在 panels/topbar.js */
  var vis = notes.filter(matches);
  /* 排序：缺省保持 host 序（pinned → updatedAt）；「按引用」= useCount 降序（同数按 updatedAt 兜底）；「相关度」= 标题命中>标签>正文（同级 updatedAt 降序），分组内顺序随过滤数组 */
  if (sortBy === 'use') vis.sort(function (a, b) { return ((b.useCount || 0) - (a.useCount || 0)) || String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')) });
  var qRel = searchText.trim().toLowerCase();
  if (sortBy === 'rel' && qRel) vis.sort(function (a, b) { return (relRank(b, qRel) - relRank(a, qRel)) || String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')) });
  $('brandCnt').textContent = t('tree.countN', { n: view.type === 'all' && filtersActiveCount() === 0 && !searchText ? notes.length : vis.length });
  /* 过滤激活（视图/筛选中心/搜索任一）：含命中的文件夹/主题强制展开（纯渲染态，不写回 foldOpen/topicOpen——清除过滤即恢复手动折叠态），分组计数切换为命中数 */
  var filtering = view.type !== 'all' || !!searchText || filtersActiveCount() > 0;
  var h = '';
  var vt = view.type === 'topic' ? t('tree.viewTopic', { id: view.id }) : t('tree.viewAll');
  h += '<div class="sec-h">' + icon('i-filter', 11) + esc(vt) + (view.type === 'topic' ? ' <span style="letter-spacing:0;text-transform:none;font-weight:500">' + esc(t('tree.crossFolderCount', { n: vis.length })) + '</span>' : '') + (view.type !== 'all' ? '<span class="add" id="viewClear" title="' + t('tree.clearViewTip') + '">✕</span>' : '') + '</div>';
  /* 置顶聚合组（筛选中心「置顶」条件激活时不再重复展示） */

function doReorderFolder(f, delta) {

  var sj = si + delta;
  if (si < 0 || sj < 0 || sj >= sibs.length) return;
  var other = sibs[sj];
  var ids = folders.map(function (x) { return x.id });
  var i = ids.indexOf(f.id), j = ids.indexOf(other.id);

function reparentFolder(fid, parentId) {

  if (!f || (f.parent || '') === (parentId || '')) return;

    if (folderSubtree(fid)[parentId]) { toast(t('fld.errCycle')); return }

  var parents = {}; parents[fid] = parentId || '';
  rpc('notes-folders', { op: 'reorder', ids: folders.map(function (x) { return x.id }), parents: parents }).then(function (res) {
    if (res && res.error) { toast(String(res.error).replace(/^notes-folders\.\w+\s*/, '')); return }
    if (parentId) { foldOpen[parentId] = true; saveFoldOpen() }
    toast(parentId ? t('fld.movedInto', { name: fname(parentId) }) : t('fld.movedRoot'));

}

/* ================= 新建笔记（本地草稿态，notes-034-batch3） =================

/* 草稿落库 payload（doDraftCreate/flushDraftCreate 共用）：有效内容闸（标题/正文非空；'Untitled' 占位视为空标题）——全空返回 null 不落库；

function draftPayloadOf(d) {

  var tags = (d._tagsStr != null ? d._tagsStr : (d.tags || []).filter(function (t) { return t !== 'quick' }).join(', '))

/* 草稿 create 链路（在位落库与切走兜底共用）：成功后在位草稿接管为正常编辑态（真实 id 回填，后续保存走 notes-update）；

function createDraftNote(d, payload) {

  $('mask').addEventListener('mousedown', function (ev) { if (ev.target === ev.currentTarget) closeModalFlushed() });

/* ================= 文件夹名称输入弹层（notes-041-folder-prompt：弃原生 prompt） =================

/* dirty 判定：在途待写 > 0 或 任一控件值 ≠ 打开时快照 */
function setDirtyCompute() {
  if (!setSnap) return false;
  if (setInflight > 0) return true;
  if ($('setLlmSel') && $('setLlmSel').value !== (setSnap.llmP && setSnap.llmM ? setSnap.llmP + '/' + setSnap.llmM : '')) return true;
  if ($('setLlmP') && ($('setLlmP').value.trim() !== setSnap.llmP || $('setLlmM').value.trim() !== setSnap.llmM)) return true;
  var nums = [['setStale', 'stale'], ['setMaxDepth', 'maxDepth'], ['setBudget', 'budget'], ['setUsageBudget', 'usageBudget'], ['setLogWeek', 'logWeek'], ['setLogMonth', 'logMonth']];
  for (var i = 0; i < nums.length; i++) { var el = $(nums[i][0]); if (el && String(el.value).trim() !== setSnap[nums[i][1]]) return true }
  return false;
}
/* dirty 状态机出口：保存（accent 实心主按钮）/还原（次按钮）enabled ⇄ disabled 灰显 */
function setDirtyRefresh() {
  var d = setDirtyCompute();
  var sv = $('setSave'), rs = $('setRestore');
  if (sv) sv.disabled = !d || setSaving;
  if (rs) rs.disabled = !d || setSaving;
}
/* 已落盘镜像逐键跟进（settings-set 成功后才调） */
function setPersistMerge(patch) {
  if (!setPersist) return;
  var n = {}, k;
  for (k in setPersist) n[k] = setPersist[k];
  if ('llm' in patch) { n.llmP = patch.llm ? patch.llm.provider : ''; n.llmM = patch.llm ? patch.llm.model : '' }
  if ('staleDays' in patch) n.stale = String(patch.staleDays);
  if ('maxFolderDepth' in patch) n.maxDepth = String(patch.maxFolderDepth);
  if ('injectBudgetChars' in patch) n.budget = String(patch.injectBudgetChars);
  if ('usageBudgetMonthly' in patch) n.usageBudget = String(patch.usageBudgetMonthly);
  if ('logWeekAfterDays' in patch) n.logWeek = String(patch.logWeekAfterDays);
  if ('logRetentionDays' in patch) n.logMonth = String(patch.logRetentionDays);
  setPersist = n;
}
