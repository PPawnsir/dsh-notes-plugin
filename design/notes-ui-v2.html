/* ================= P1 回收站（侧栏底部「回收站」入口）：notes-list {includeDeleted:true} 过滤 deleted → 恢复（notes-restore）/ 彻底删除（notes-purge） =================
   彻底删除双确认：点「彻底删除」→ confirm「彻底删除不可恢复」确认才执行；host 侧安全闸只接受已软删除的笔记。 */
function openTrash() {
  trashState = { list: null, pending: '' };
  openModal(
    '<div class="modal-t">' + icon('i-trash', 13) + ' 回收站<span class="sub">软删除的笔记 · 恢复可找回 · 彻底删除不可恢复</span></div>'
    + '<div id="trashList"><div class="modal-hint">加载中…</div></div>'
    + '<div class="modal-err" id="mErr" style="display:none"></div>'
    + '<div class="modal-acts"><button class="mbtn" id="trashClose">关闭</button></div>'
  );
  $('trashClose').onclick = function () { if (!trashState || !trashState.pending) { closeModal(); trashState = null } };
  loadTrash();
}
function loadTrash() {
  rpc('notes-list', { includeDeleted: true }).then(function (res) {
    if (!trashState) return;
    if (res && res.error) { trashState.list = []; renderTrashList(); modalErr(res.error); return }
    trashState.list = ((res && res.notes) || []).filter(function (n) { return n.deleted === true });
    trashState.list.sort(function (a, b) { return String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')) });   /* 删除时间（updatedAt 近似）降序 */
    renderTrashList();
  }).catch(function (e) { if (trashState) { trashState.list = []; renderTrashList(); modalErr('加载失败：' + (e && e.message || e)) } });
}
/* 回收站列表（复用归档预览的列表样式 arch-list/arch-row）：行 = 标题 + 删除时间（updatedAt 近似）+ 恢复 / 彻底删除按钮 */
function renderTrashList() {
  var host = $('trashList'); if (!host || !trashState) return;
  var list = trashState.list || [];
  if (!list.length) { host.innerHTML = '<div class="modal-hint">回收站为空（删除的笔记会出现在这里）。</div>'; return }
  host.innerHTML = '<div class="arch-list">'
    + list.map(function (n) {
        return '<div class="arch-row"><span class="ti" title="' + esc(n.title || 'Untitled') + '">' + esc(n.title || 'Untitled') + '</span>'
          + '<span class="meta">删于 ' + esc(n.updatedAt ? String(n.updatedAt).slice(0, 10) : '—') + '</span>'
          + '<button class="mbtn trash-act" data-id="' + esc(n.id) + '" data-act="restore"' + (trashState.pending ? ' disabled' : '') + '>恢复</button>'
          + '<button class="mbtn danger trash-act" data-id="' + esc(n.id) + '" data-act="purge"' + (trashState.pending ? ' disabled' : '') + '>彻底删除</button></div>'
      }).join('') + '</div>';
  host.querySelectorAll('.trash-act').forEach(function (el) {
    el.onclick = function () {
      var id = el.dataset.id, n = list.find(function (x) { return x.id === id });
      if (el.dataset.act === 'restore') doTrashRestore(id); else doTrashPurge(id, n && n.title);
    };
  });
}
function doTrashRestore(id) {
  if (!trashState || trashState.pending) return;
  trashState.pending = id; renderTrashList();
  rpc('notes-restore', { id: id }).then(function (res) {
    if (!trashState) return;
    trashState.pending = '';
    if (res && res.error) { modalErr(res.error); renderTrashList(); return }
    toast('已恢复');
    loadTrash(); loadNotes(true);
  }).catch(function (e) { if (trashState) { trashState.pending = ''; modalErr('恢复失败：' + (e && e.message || e)); renderTrashList() } });
}
function doTrashPurge(id, title) {
  if (!trashState || trashState.pending) return;
  if (!confirm('彻底删除不可恢复：「' + (title || id) + '」\n删除后正文与归档备份将一并移除，确认彻底删除？')) return;
  trashState.pending = id; renderTrashList();
  rpc('notes-purge', { id: id }).then(function (res) {
    if (!trashState) return;
    trashState.pending = '';
    if (res && res.error) { modalErr(res.error); renderTrashList(); return }
    toast('已彻底删除');
    loadTrash(); loadNotes(true);
  }).catch(function (e) { if (trashState) { trashState.pending = ''; modalErr('删除失败：' + (e && e.message || e)); renderTrashList() } });
}

/* ================= 整理建议（设置卡片「整理建议」行入口）：notes-suggest（dry-run 零写入）三段式 modal =================
   契约：{ archiveCandidates:速记组（结构与 notes-archive-preview 同源）, staleCandidates:过期未引用, orphanCandidates:孤儿（仅展示）, generatedAt }
   红线：只提名不自动执行——速记组「去归档」直达归档预览对话框；过期未引用「一键批量软删除」confirm 后才逐条 notes-delete（软删可恢复）；
   孤儿候选是启发式判定（可能误伤），不提供批量操作，逐条跳转人工过目。 */
function openSuggest() {
  suggestState = { data: null, pending: false };
  openModal(
    '<div class="modal-t">' + icon('i-sparkle', 13) + ' 整理建议<span class="sub">只提名不自动执行 · 软删除可恢复</span></div>'
    + '<div id="suggestList"><div class="modal-hint">分析中…</div></div>'
    + '<div class="modal-err" id="mErr" style="display:none"></div>'
    + '<div class="modal-acts"><button class="mbtn" id="suggestClose">关闭</button></div>'
  );
  $('suggestClose').onclick = function () { if (!suggestState || !suggestState.pending) { closeModal(); suggestState = null } };
  loadSuggest();
}
function loadSuggest() {
  rpc('notes-suggest', {}).then(function (res) {
    if (!suggestState) return;
    if (res && res.error) { suggestState.data = { archiveCandidates: [], staleCandidates: [], orphanCandidates: [] }; renderSuggestList(); modalErr(res.error); return }
    suggestState.data = res || { archiveCandidates: [], staleCandidates: [], orphanCandidates: [] };
    renderSuggestList();
  }).catch(function (e) { if (suggestState) { suggestState.data = { archiveCandidates: [], staleCandidates: [], orphanCandidates: [] }; renderSuggestList(); modalErr('分析失败：' + (e && e.message || e)) } });
}
/* 三段式列表（复用 arch-list/arch-row）：① 速记组（「去归档」直达归档预览，数据同源）② 过期未引用（一键批量软删 confirm）③ 可能无用（仅展示，逐条「查看」跳转） */
function renderSuggestList() {
  var host = $('suggestList'); if (!host || !suggestState) return;
  var d = suggestState.data;
  if (!d) { host.innerHTML = '<div class="modal-hint">分析中…</div>'; return }
  var arch = d.archiveCandidates || [], stale = d.staleCandidates || [], orphans = d.orphanCandidates || [];
  if (!arch.length && !stale.length && !orphans.length) { host.innerHTML = '<div class="modal-hint">库很干净，无需整理。</div>'; return }
  var h = '';
  /* ① 可整理的速记组 */
  h += '<div class="sg-sec"><div class="sg-sec-t">可整理的速记组<span class="sg-sec-n">' + arch.length + ' 组</span>'
    + (arch.length ? '<button class="mbtn trash-act" id="sgGoArch">去归档</button>' : '') + '</div>';
  h += arch.length
    ? '<div class="arch-list">' + arch.map(function (g) {
        var span = g.dateSpan && g.dateSpan.from ? (g.dateSpan.from === g.dateSpan.to ? g.dateSpan.from : g.dateSpan.from + ' ~ ' + g.dateSpan.to) : '';
        return '<div class="arch-row"><span class="ti" title="' + esc(g.title) + '">' + esc(g.title) + '</span>'
          + '<span class="meta">' + esc(span) + ' · ' + g.members.length + ' 条 · ' + fmtBytes(g.totalBytes) + ((g.totalUseCount || 0) > 0 ? ' · 被引用 ' + g.totalUseCount + ' 次' : '') + '</span></div>'
      }).join('') + '</div>'
    : '<div class="modal-hint">没有可归档的速记组（同一会话 ≥2 条速记才会成组）。</div>';
  h += '</div>';
  /* ② 过期未引用（useCount=0 且超 staleDays；一键批量软删 confirm 后才执行） */
  h += '<div class="sg-sec"><div class="sg-sec-t">过期未引用<span class="sg-sec-n">' + stale.length + ' 条</span>'
    + (stale.length ? '<button class="mbtn danger trash-act" id="sgBatchDel"' + (suggestState.pending ? ' disabled' : '') + '>' + (suggestState.pending ? '删除中…' : '一键批量软删除') + '</button>' : '') + '</div>';
  h += stale.length
    ? '<div class="arch-list">' + stale.map(function (n) {
        return '<div class="arch-row"><span class="ti" title="' + esc(n.title || 'Untitled') + '">' + esc(n.title || 'Untitled') + '</span>'
          + '<span class="meta">' + esc(n.topic || '未分类') + ' · ' + n.staleDays + ' 天未更新</span></div>'
      }).join('') + '</div>'
    : '<div class="modal-hint">没有过期且从未被引用的笔记。</div>';
  h += '</div>';
  /* ③ 可能无用（孤儿候选：启发式判定可能误伤——仅展示逐条「查看」，不提供批量操作） */
  h += '<div class="sg-sec"><div class="sg-sec-t">可能无用<span class="sg-sec-n">' + orphans.length + ' 条</span></div>';
  h += orphans.length
    ? '<div class="arch-list">' + orphans.map(function (n) {
        return '<div class="arch-row"><span class="ti" title="' + esc(n.title || 'Untitled') + '">' + esc(n.title || 'Untitled') + '</span>'
          + '<span class="meta">' + esc(n.topic || '未分类') + ' · ' + esc(n.updatedAt ? String(n.updatedAt).slice(0, 10) : '—') + '</span>'
          + '<button class="mbtn trash-act sg-view" data-id="' + esc(n.id) + '">查看</button></div>'
      }).join('') + '</div>'
    : '<div class="modal-hint">没有孤儿笔记（无双链关联且从未被引用）。</div>';
  h += '</div>';
  h += '<div class="modal-hint">判定口径：过期 = 超过时效阈值（设置卡片可调）且从未被引用；可能无用 = 无 [[双链]] 关联、未注入、从未被引用的进行中普通笔记（启发式，请逐条过目）。</div>';
  host.innerHTML = h;
  var go = $('sgGoArch'); if (go) go.onclick = function () { closeModal(); suggestState = null; openArchive() };   /* 直达归档预览（数据与 notes-archive-preview 同源） */
  var bd = $('sgBatchDel'); if (bd) bd.onclick = doSuggestBatchDelete;
  host.querySelectorAll('.sg-view').forEach(function (el) {
    el.onclick = function () { var id = el.dataset.id; closeModal(); suggestState = null; selectNote(id) };
  });
}
/* 过期未引用一键批量软删：confirm 确认后才执行；逐条 notes-delete（软删，回收站可恢复）；删后刷新建议 + 列表 */
function doSuggestBatchDelete() {
  if (!suggestState || suggestState.pending || !suggestState.data) return;
  var list = suggestState.data.staleCandidates || [];
  if (!list.length) return;
  if (!confirm('一键批量软删除：' + list.length + ' 条过期且从未被引用的笔记将移入回收站（可恢复）。\n确认删除？')) return;
  suggestState.pending = true; renderSuggestList();
  var ok = 0, fail = 0, chain = Promise.resolve();
  list.forEach(function (n) {
    chain = chain.then(function () {
      return rpc('notes-delete', { id: n.id }).then(function (res) { if (res && res.error) fail++; else ok++ }, function () { fail++ });
    });
  });
  chain.then(function () {
    if (!suggestState) return;
    suggestState.pending = false;
    toast('已软删除 ' + ok + ' 条（回收站可恢复）' + (fail ? '，失败 ' + fail + ' 条' : ''));
    loadSuggest(); afterArchiveRefresh();
  });
}

/* ================= 快速记录卡片（v2）：正文划选松手触发 ================= */
var capEl = null, capText = '';
document.addEventListener('mouseup', function (ev) {
  if (capEl && capEl.contains(ev.target)) return;
  if (ev.target.closest && ev.target.closest('input,textarea,select,.modal,.ctxmenu')) return;
  var sel = window.getSelection();
  var txt = sel && !sel.isCollapsed ? String(sel).trim() : '';
  if (!txt || txt.length < 2) return;
  var rect = sel.getRangeAt(0).getBoundingClientRect();
  showCap(txt.slice(0, 500), rect.right + 8, rect.bottom + 6);
});
function showCap(text, x, y) {
  closeCap(); capText = text;
  capEl = document.createElement('div'); capEl.className = 'cap';
  capEl.innerHTML =
    '<div class="cap-h"><span class="src">' + icon('i-note', 11) + '选区速记</span>'
    + '<span class="auto"><span class="dot"></span>记录为 引用</span></div>'
    + '<div class="cap-pv">' + esc(text.length > 160 ? text.slice(0, 160) + '…' : text) + '</div>'
    + '<div class="cap-in">' + icon('i-plus', 12) + '<input id="capInput" placeholder="可补充：打标签 / 引导标题 / 定类型…"><span class="kbd">Enter 记录</span></div>'
    + '<div class="cap-acts">'
    + '<button class="cbtn" id="capCopy">' + icon('i-note') + '复制</button>'
    + '<button class="cbtn primary" id="capSave">' + icon('i-check', 12) + '记录</button>'
    + '<button class="cbtn" id="capCancel">取消</button></div>';
  $('capHost').appendChild(capEl);
  var pw = capEl.offsetWidth || 300, ph = capEl.offsetHeight || 180;
  capEl.style.left = Math.max(8, Math.min(x, innerWidth - pw - 14)) + 'px';
  capEl.style.top = Math.max(8, Math.min(y, innerHeight - ph - 14)) + 'px';
  $('capInput').focus();
  $('capCopy').onclick = function () {
    var done = function () { toast('已复制选区'); closeCap() };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(capText).then(done, done);
    else done();
  };
  $('capSave').onclick = saveCap;
  $('capCancel').onclick = closeCap;
  capEl.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && ev.target.id === 'capInput') { ev.preventDefault(); saveCap() }
    if (ev.key === 'Escape') { ev.stopPropagation(); closeCap() }
  });
}
function saveCap() {
  var input = $('capInput');
  var hint = input ? input.value.trim() : '';
  var text = capText;
  closeCap();
  if (!text) return;
  /* 有备注 → notes-quick-instruct（LLM 提取 tags/titleHint/kind/inject）；无备注 → notes-quick（合并窗口 + 异步分类）。
     sessionId/cwd 传空：页面无会话上下文，标题回退由 host 兜底。 */
  var call = hint
    ? rpc('notes-quick-instruct', { text: text, note: hint, sessionId: '', cwd: '' })
    : rpc('notes-quick', { text: text, sessionId: '', cwd: '', kind: 'quote' });
  call.then(function (res) {
    if (res && res.error) { toast(res.error); return }
    toast(res && res.merged ? '已合并进今日速记' : '已记录为引用（主题分类由 host LLM 异步回填）');
    loadNotes(true).then(function () { if (res && res.id && !res.merged) selectNote(res.id) });
    /* 分类异步回填：延迟静默重拉两次，标题/主题自动刷新可见 */
    setTimeout(function () { loadNotes(true) }, 4000);
    setTimeout(function () { loadNotes(true) }, 10000);
  }).catch(function (e) { toast('记录失败：' + (e && e.message || e)) });
}
function closeCap() { if (capEl) { capEl.remove(); capEl = null } if (window.getSelection) window.getSelection().removeAllRanges() }

/* ================= 显式归档：预览对话框（勾选才执行）+ toast 撤销 + 多选合并 ================= */
function fmtBytes(n) { n = +n || 0; return n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB' }
function openArchive() {
  archState = { groups: null, checked: {}, expand: {}, pending: false };
  renderArchModal();
  rpc('notes-archive-preview', {}).then(function (res) {
    if (!archState) return;
    if (res && res.error) { archState.groups = []; renderArchList(); modalErr(res.error); return }
    archState.groups = (res && res.quickGroups) || [];
    renderArchList();
  }).catch(function (e) { if (archState) { archState.groups = []; renderArchList(); modalErr('预览加载失败：' + (e && e.message || e)) } });
}
function archCheckedCount() { return archState && archState.groups ? archState.groups.filter(function (g) { return archState.checked[g.sessionId] !== false }).length : 0 }
function renderArchModal() {
  openModal(
    '<div class="modal-t">' + icon('i-check', 13) + ' 归档预览<span class="sub">勾选后才执行 · 合并可撤销</span></div>'
    + '<div class="modal-hint">速记按会话分组，勾选的组合并成一篇归档笔记（原笔记备份后软删除）。</div>'
    + '<div id="archList"><div class="modal-hint">加载中…</div></div>'
    + '<div class="modal-hint">手动笔记不受影响；如需合并手动笔记，请在列表多选后右键合并。</div>'
    + '<div class="modal-err" id="mErr" style="display:none"></div>'
    + '<div class="modal-acts"><button class="mbtn" id="archCancel">取消</button><button class="mbtn primary" id="archOk" disabled>归档所选</button></div>'
  );
  $('archCancel').onclick = function () { closeModal(); archState = null };
  $('archOk').onclick = doArchiveConfirm;
}
/* 组列表：复选框（缺省全勾）+ caret 展开成员明细（标题+日期）+ 组标题 + dateSpan · N 条 · totalBytes */
function renderArchList() {
  var host = $('archList'); if (!host || !archState) return;
  var gs = archState.groups || [];
  var ok = $('archOk');
  if (!gs.length) { host.innerHTML = '<div class="modal-hint">没有可归档的速记组（同一会话 ≥2 条速记才会成组）。</div>'; if (ok) { ok.disabled = true; ok.textContent = '归档所选（0 组）' } return }
  var h = '<div class="arch-list">';
  gs.forEach(function (g) {
    var ck = archState.checked[g.sessionId] !== false;
    var open = archState.expand[g.sessionId] === true;
    var span = g.dateSpan && g.dateSpan.from ? (g.dateSpan.from === g.dateSpan.to ? g.dateSpan.from : g.dateSpan.from + ' ~ ' + g.dateSpan.to) : '';
    h += '<div class="arch-group' + (ck ? '' : ' off') + '">'
      + '<div class="arch-row">'
      + '<input type="checkbox" class="arch-check" data-sid="' + esc(g.sessionId) + '"' + (ck ? ' checked' : '') + '>'
      + '<span class="caret' + (open ? ' open' : '') + '" data-exp="' + esc(g.sessionId) + '">' + icon('i-chev', 10) + '</span>'
      + '<span class="ti" title="' + esc(g.title) + '">' + esc(g.title) + '</span>'
      + '<span class="meta">' + esc(span) + ' · ' + g.members.length + ' 条 · ' + fmtBytes(g.totalBytes) + ((g.totalUseCount || 0) > 0 ? ' · 被引用 ' + g.totalUseCount + ' 次' : '') + '</span></div>'
      + (open ? '<div class="arch-members">' + g.members.map(function (m) { return '<div class="arch-member"><span class="ti">' + esc(m.title || '无标题') + '</span><span class="dt">' + esc(String(m.updatedAt || '').slice(0, 10)) + '</span></div>' }).join('') + '</div>' : '')
      + '</div>';
  });
  host.innerHTML = h + '</div>';
  if (ok) { ok.disabled = archCheckedCount() === 0; ok.textContent = '归档所选（' + archCheckedCount() + ' 组）' }
  host.querySelectorAll('.arch-check').forEach(function (el) { el.onchange = function () { archState.checked[el.dataset.sid] = el.checked; renderArchList() } });
  host.querySelectorAll('[data-exp]').forEach(function (el) { el.onclick = function () { var sid = el.dataset.exp; archState.expand[sid] = !archState.expand[sid]; renderArchList() } });
}
/* 归档/合并后公共收尾：被合并笔记从列表消失——若正打开的笔记被合并则回空态；静默刷新列表 */
function afterArchiveRefresh() {
  loadNotes(true).then(function () {
    if (selId && !notes.some(function (n) { return n.id === selId })) { selId = null; edNote = null; renderEd() }
    render();
  });
}
/* 确认归档：勾选组 → notes-archive 白名单组（host 先全量校验再动手）→ toast「已合并 N 组」+ 撤销按钮 */
function doArchiveConfirm() {
  if (!archState || archState.pending) return;
  var gs = (archState.groups || []).filter(function (g) { return archState.checked[g.sessionId] !== false });
  if (!gs.length) return;
  archState.pending = true; var ok = $('archOk'); if (ok) { ok.disabled = true; ok.textContent = '归档中…' }
  /* payload 禁 undefined：白名单组不带 title（用 host 默认标题规则） */
  rpc('notes-archive', { groups: gs.map(function (g) { return { memberIds: g.members.map(function (m) { return m.id }) } }) }).then(function (res) {
    if (res && res.error) { archState.pending = false; modalErr(res.error); if (ok) { ok.disabled = false; ok.textContent = '归档所选（' + archCheckedCount() + ' 组）' } return }
    closeModal(); archState = null;
    toast('已合并 ' + (res && res.merged || 0) + ' 组', { label: '撤销', fn: doArchiveUndo });
    afterArchiveRefresh();
  }).catch(function (e) { if (archState) { archState.pending = false; modalErr('归档失败：' + (e && e.message || e)); if (ok) { ok.disabled = false; ok.textContent = '归档所选（' + archCheckedCount() + ' 组）' } } });
}
/* 撤销最近一次归档（undo 事务文件）：归档笔记软删 + 成员批量恢复 */
function doArchiveUndo() {
  rpc('notes-archive-undo', {}).then(function (res) {
    if (res && res.error) { toast(res.error); return }
    toast(res && res.undone ? '已撤销归档' : '没有可撤销的归档');
    afterArchiveRefresh();
  }).catch(function (e) { toast('撤销失败：' + (e && e.message || e)) });
}
/* 多选合并：操作条「合并」→ 标题输入（默认 = 所选最早更新笔记的 topic）→ notes-archive 单组 */
function openMerge() {
  var ids = Object.keys(selIds);
  if (ids.length < 2) { toast('至少选择 2 条笔记'); return }
  var sel = notes.filter(function (n) { return selIds[n.id] }).sort(function (a, b) { return String(a.updatedAt || '').localeCompare(String(b.updatedAt || '')) });
  openModal(
    '<div class="modal-t">' + icon('i-note', 13) + ' 合并所选笔记</div>'
    + '<div class="modal-hint">把所选的 ' + ids.length + ' 条笔记合并为一篇（正文按更新时间分节拼接，原笔记软删除，可撤销）。</div>'
    + '<input class="minput" id="mergeTitle" value="' + esc((sel[0] && sel[0].topic) || '合并笔记') + '" placeholder="合并后标题…">'
    + '<div class="modal-err" id="mErr" style="display:none"></div>'
    + '<div class="modal-acts"><button class="mbtn" id="mgCancel">取消</button><button class="mbtn primary" id="mgOk">合并</button></div>'
  );
  $('mgCancel').onclick = closeModal;
  $('mgOk').onclick = doMergeConfirm;
  var ti = $('mergeTitle'); ti.focus();
  ti.onkeydown = function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); doMergeConfirm() } };
}
function doMergeConfirm() {
  var ids = Object.keys(selIds);
  var t = $('mergeTitle').value.trim();
  if (ids.length < 2 || !t) return;
  var g = { memberIds: ids }; if (t) g.title = t;   /* payload 禁 undefined：空标题不传 title 字段 */
  $('mgOk').disabled = true; $('mgOk').textContent = '合并中…';
  rpc('notes-archive', { groups: [g] }).then(function (res) {
    if (res && res.error) { modalErr(res.error); $('mgOk').disabled = false; $('mgOk').textContent = '合并'; return }
    closeModal();
    selMode = false; selIds = {}; renderTree();
    toast('已合并所选 ' + ids.length + ' 条', { label: '撤销', fn: doArchiveUndo });
    afterArchiveRefresh();
  }).catch(function (e) { modalErr('合并失败：' + (e && e.message || e)); $('mgOk').disabled = false; $('mgOk').textContent = '合并' });
}

/* ================= 顶栏：刷新 / 归档 / 主题 ================= */
$('btnRefresh').addEventListener('click', function () { searchIds = null; loadNotes(); if (sessList.length) pullSessions(); toast('已刷新') });
$('btnArchive').addEventListener('click', openArchive);
$('btnSelMode').addEventListener('click', function () { selMode = !selMode; selIds = {}; renderTree() });
/* ================= 筛选中心交互（popover 开关 / 勾选即时生效 / chip × 单条移除 / 排序菜单） ================= */
$('btnFilter').addEventListener('click', function (ev) { ev.stopPropagation(); filterOpen = !filterOpen; if (filterOpen) sortOpen = false; renderFilterBar() });
$('btnSort').addEventListener('click', function (ev) { ev.stopPropagation(); sortOpen = !sortOpen; if (sortOpen) filterOpen = false; renderFilterBar() });
/* popover：勾选即时生效（组内 OR / 跨组 AND；条件变化持久化 + 有搜索词时重搜） */
$('fpop').addEventListener('change', function (ev) {
  var cb = ev.target; if (!cb.matches || !cb.matches('input[type=checkbox]')) return;
  if (cb.dataset.ft) filters[cb.dataset.ft] = cb.checked;
  else if (cb.dataset.fk) { var i = filters.kinds.indexOf(cb.dataset.fk); if (cb.checked && i < 0) filters.kinds.push(cb.dataset.fk); if (!cb.checked && i >= 0) filters.kinds.splice(i, 1) }
  saveFilters(); render(); reSearch();
});
$('fpop').addEventListener('click', function (ev) {
  if (ev.target.closest('#popClear')) { clearFilters(); render(); renderFilterBar(); reSearch(); toast('已清空全部筛选条件') }
  else if (ev.target.closest('#popDone')) { filterOpen = false; renderFilterBar() }
});
/* 激活条件 chip：× 单条移除（与 popover 勾选双向同步） */
$('fchips').addEventListener('click', function (ev) {
  var x = ev.target.closest('.x'); if (!x) return;
  var c = x.parentElement;
  if (c.dataset.ft) filters[c.dataset.ft] = false;
  else if (c.dataset.fk) { var i = filters.kinds.indexOf(c.dataset.fk); if (i >= 0) filters.kinds.splice(i, 1) }
  saveFilters(); render(); reSearch();
});
/* 排序菜单：单选，选择即关闭（与筛选条件正交，互不重置） */
$('fsortMenu').addEventListener('click', function (ev) {
  var it = ev.target.closest('.fsort-item'); if (!it) return;
  sortBy = it.dataset.fs; sortOpen = false; saveFilters(); render();
});
$('selCancel').addEventListener('click', function () { selMode = false; selIds = {}; renderTree() });
$('selMerge').addEventListener('click', openMerge);
/* ================= 侧栏宽度拖拽条（4px 分隔条：拖拽调整 / localStorage 记忆 / 双击重置缺省） ================= */
/* clamp 200px–60%（相对 .app 容器宽）；localStorage key 独立于浮动面板 */
var SIDE_W_KEY = 'dsh-notes-app-sidebar-w', SIDE_W_DEFAULT = 342;
var sideEl = document.querySelector('.app .side'), splitterEl = $('splitter');
function clampSideW(w) { return Math.max(200, Math.min(Math.round(document.querySelector('.app').getBoundingClientRect().width * 0.6), Math.round(w))) }
function applySideW(w) { sideEl.style.width = clampSideW(w) + 'px' }
function loadSideW() { try { var v = parseInt(localStorage.getItem(SIDE_W_KEY), 10); if (v >= 200) applySideW(v) } catch (e) {} }
function saveSideW(w) { try { if (w == null) localStorage.removeItem(SIDE_W_KEY); else localStorage.setItem(SIDE_W_KEY, String(w)) } catch (e) {} }
splitterEl.addEventListener('mousedown', function (ev) {
  ev.preventDefault();
  var sx = ev.clientX, sw = sideEl.getBoundingClientRect().width;
  splitterEl.classList.add('on'); document.body.classList.add('split-drag');   /* 拖拽期间禁文本选择 + 强制 col-resize */
  /* mousemove 挂 document、mouseup 移除监听防泄漏 */
  function onMove(ev2) { applySideW(sw + ev2.clientX - sx) }
  function onUp() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    splitterEl.classList.remove('on'); document.body.classList.remove('split-drag');
    saveSideW(sideEl.getBoundingClientRect().width);
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
});
/* 双击分隔条 = 重置缺省宽度（并清除持久化） */
splitterEl.addEventListener('dblclick', function () { applySideW(SIDE_W_DEFAULT); saveSideW(null) });
/* 窗口 resize 按新 60% 上限复核（不回写持久化，窗口放大后恢复原宽） */
window.addEventListener('resize', function () { applySideW(sideEl.getBoundingClientRect().width) });
loadSideW();
function applyTheme(t) { document.documentElement.dataset.theme = t; try { localStorage.setItem('dsh-notes-app-theme', t) } catch (e) {} }
$('btnTheme').addEventListener('click', function () { applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark') });
try { var savedTheme = localStorage.getItem('dsh-notes-app-theme'); if (savedTheme === 'light' || savedTheme === 'dark') applyTheme(savedTheme) } catch (e) {}

/* ================= 键盘 ================= */
document.addEventListener('keydown', function (ev) {
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); $('q').focus(); return }
  if (ev.key === 'Escape') {
    if ($('modalHost').firstChild) { closeModal(); archState = null; trashState = null; suggestState = null; return }   /* 归档预览/合并/回收站/整理建议对话框走 modalHost，Esc 统一关 */
    if (sortOpen) { sortOpen = false; renderFilterBar(); return }   /* 排序菜单 Esc（优先于筛选 popover） */
    if (filterOpen) { filterOpen = false; renderFilterBar(); return }   /* 筛选 popover Esc 关闭 */
    if (scopeOpen) { scopeOpen = false; renderScopePanel(); return }
    if (capEl) { closeCap(); return }
    if ($('ctxHost').firstChild) { closeCtx(); return }
    if (selMode) { selMode = false; selIds = {}; renderTree(); return }   /* Esc 退出多选态 */
    if (!document.activeElement || !document.activeElement.isContentEditable) { searchText = ''; searchIds = null; searchMeta = {}; $('q').value = ''; render() }
  }
});

/* ================= 启动 ================= */
function render() { renderTree(); if (edNote) renderMeta() }
loadNotes();
</script>
</body>
</html>
